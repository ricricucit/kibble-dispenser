version = 1

# When several annotations match a path, the last one wins: keep general blocks first.

# Software: firmware, scripts, CI, templates and configuration
[[annotations]]
path = [
  "firmware/**",
  "hardware/cad/*.py",
  ".github/**",
  "site/**",
  "tools/**",
  ".gitignore",
  ".gitattributes",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "MIT"

# Hardware design files: part geometry and design data
[[annotations]]
path = [
  "hardware/assembly/**",
  "hardware/cad/*.json",
  "hardware/cad/ref/**",
  "hardware/template/**",
  "hardware/bom.json",
  "hardware/module/VERSION",
  "hardware/module/case-1.0/parts/**",
  "hardware/module/case-1.0/interface/**",
  "hardware/VERSION",
]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# Documentation, prose and photos
[[annotations]]
path = [
  "docs/**",
  "*.md",
  "hardware/README.md",
  "hardware/cad/*.png",
  "hardware/module/README.md",
  "hardware/module/case-1.0/README.md",
  "firmware/README.md",
  "import/**/*.md",
  "product/**",
  "site/content/**",
  "site/img/**",
  "LICENSE",
]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# MicroPython firmware imported from the owner's "feedr-outdoor" project: MIT as a whole,
# including its own Markdown files (README.md, PROJECT.md, CLAUDE.md)
[[annotations]]
path = "firmware/micropython/**"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "MIT"

# Code of Conduct: adapted from the Contributor Covenant 2.1
[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = [
  "2026 Enrico Icardi and contributors",
  "Contributor Covenant contributors <https://www.contributor-covenant.org>",
]
SPDX-License-Identifier = "CC-BY-4.0"

# three.js r128 (npm package "three" 0.128.0, UMD build three.min.js), vendored for the 3D page
# (site/viewer/template.html uses the r128 API)
[[annotations]]
path = "site/vendor/three-r128/**"
SPDX-FileCopyrightText = "2010-2021 three.js authors"
SPDX-License-Identifier = "MIT"

# Print package (chassis 6.4 and module case 1.0): Bambu Studio projects, plate 3MFs, STL files, layout, slicer data
[[annotations]]
path = "hardware/plates/**"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# ... its generator scripts (software)
[[annotations]]
path = "hardware/plates/tools/**"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "MIT"

# ... except the fixed part positions the generator reuses (design data, like layout.json)
[[annotations]]
path = "hardware/plates/tools/reference_layout.json"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# ... and its print guide and plate preview images (documentation)
[[annotations]]
path = ["hardware/plates/PRINT_GUIDE.md", "hardware/plates/preview/**"]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The scripts of the print review (docs/reviews/; the report and its evidence are documentation)
[[annotations]]
path = "docs/reviews/**/*.py"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "MIT"

# Assembly guide (site/assembly/, copied as built): the code stays MIT (site/**); the step texts and data are
# documentation, the meshes and the drilling template are hardware
[[annotations]]
path = "site/assembly/js/data.js"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["site/assembly/models/**", "site/assembly/template/**"]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# three.js r128 bundled again by the assembly guide (same file as site/vendor/three-r128/)
[[annotations]]
path = "site/assembly/vendor/three-r128/**"
SPDX-FileCopyrightText = "2010-2021 three.js authors"
SPDX-License-Identifier = "MIT"
