version = 1

# When several annotations match a path, the last one wins: keep general blocks first.

# Software: firmware, scripts, CI, templates and configuration
[[annotations]]
path = [
  "firmware/**",
  "hardware/cad/*.py",
  "hardware/v6/cad/*.py",
  ".github/**",
  "site/**",
  ".gitignore",
  ".gitattributes",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "MIT"

# Hardware design files: part geometry and design data
[[annotations]]
path = [
  "hardware/stl/**",
  "hardware/3mf/**",
  "hardware/assembly/**",
  "hardware/cad/*.json",
  "hardware/v6/stl/**",
  "hardware/v6/3mf/**",
  "hardware/v6/assembly/**",
  "hardware/v6/cad/*.json",
  "hardware/v6/bom.json",
]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# Documentation, prose and photos
[[annotations]]
path = [
  "docs/**",
  "*.md",
  "hardware/README.md",
  "hardware/v6/README.md",
  "hardware/v6/cad/*.png",
  "firmware/README.md",
  "import/**/*.md",
  "site/index.html",
  "LICENSE",
]
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# MicroPython firmware imported from the owner's "feedr-outdoor" project: MIT as a whole,
# including its own Markdown files (README.md, PROJECT.md, CLAUDE.md)
[[annotations]]
path = "firmware/micropython/**"
SPDX-FileCopyrightText = "2026 Enrico Icardi and contributors"
SPDX-License-Identifier = "MIT"

# Code of Conduct: adapted from the Contributor Covenant 2.1
[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = [
  "2026 Enrico Icardi and contributors",
  "Contributor Covenant contributors <https://www.contributor-covenant.org>",
]
SPDX-License-Identifier = "CC-BY-4.0"

# three.js 0.160.1 (npm package "three"), vendored for the website so it loads no third-party CDN
[[annotations]]
path = "site/vendor/three/**"
SPDX-FileCopyrightText = "2010-2023 three.js authors"
SPDX-License-Identifier = "MIT"

# three.js r128 (npm package "three" 0.128.0, UMD build three.min.js), vendored for the v6 3D page
# (site/viewer/template.html uses the r128 API)
[[annotations]]
path = "site/vendor/three-r128/**"
SPDX-FileCopyrightText = "2010-2021 three.js authors"
SPDX-License-Identifier = "MIT"
