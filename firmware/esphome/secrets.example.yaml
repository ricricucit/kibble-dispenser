# Copy to secrets.yaml (git-ignored) and replace every value.
# EN 18031-1: no default or shared passwords. Generate new values for every device.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Password of the fallback hotspot that opens when Wi-Fi is unreachable (8+ characters).
fallback_ap_password: "REPLACE-with-a-unique-password"

# 32-byte base64 key, e.g. from:  openssl rand -base64 32
api_encryption_key: "REPLACE-with-the-output-of-openssl-rand-base64-32"

# Unique OTA password, e.g. from:  openssl rand -hex 16
ota_password: "REPLACE-with-a-unique-password"
