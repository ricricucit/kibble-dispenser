name: CAD v6.2

# Regenerates design v6.2 from its scripts in a temporary copy and checks every mesh. The chain runs the earlier stages
# it builds on first (v6 with build_dosing/build_v5, v6.1, v6.1.1, each with its checks) and takes 10 to 20 minutes,
# so it only runs when the v6.2 CAD scripts or the mesh check change, and on demand from the Actions tab.
# The committed v6.2 meshes are checked on every push by the meshes-v62 job in ci.yml.

on:
  push:
    paths:
      - "hardware/v6.2/cad/**"
      - "hardware/cad/check_meshes.py"
      - ".github/workflows/cad-v62.yml"
  pull_request:
    paths:
      - "hardware/v6.2/cad/**"
      - "hardware/cad/check_meshes.py"
      - ".github/workflows/cad-v62.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad-v62:
    name: Regenerate design v6.2 and check meshes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAD dependencies
        run: pip install trimesh manifold3d shapely mapbox_earcut rtree numpy scipy networkx lxml matplotlib fast_simplification

      # build_v62.py runs build_v6.py (with build_dosing.py and build_v5.py), build_v61.py and build_v611.py first,
      # then builds v6.2, runs its checks and publishes assembly/, template/, v62.json and check_v62.png in the copy
      - name: Build v6.2 in a temporary copy of hardware/v6.2
        run: |
          tmp="$(mktemp -d)"
          cp -r hardware/v6.2 "$tmp/"
          python "$tmp/v6.2/cad/build_v62.py"
          echo "V62_TMP=$tmp/v6.2" >> "$GITHUB_ENV"

      # The colour-body exports of three v6.1 plates (build/*_v61_print_<colour>.stl) are known to be empty; v6.1.1
      # re-exports them as *_v611.stl, which are checked, and v6.2 does not use either.
      - name: Check every v6.2 mesh is closed
        run: >-
          python hardware/cad/check_meshes.py "$V62_TMP"
          --skip 'cad/build/*_v61_print_black.stl' --skip 'cad/build/*_v61_print_green.stl'
          --skip 'cad/build/*_v61_print_orange.stl'

      - name: The checks of v62.json passed
        run: |
          python - "$V62_TMP/cad/v62.json" <<'EOF'
          import json, sys
          c = json.load(open(sys.argv[1]))['checks']
          bad = [k for k, v in c['watertight_exported_stl_reload'].items() if not v]
          assert not bad, f'not watertight after export: {bad}'
          assert c['hard_interference_mm3_max'] == 0.0, c['hard_interference_nonzero']
          assert c['interlock_strict'] is True, 'gate interlock is not strict'
          print('watertight, no hard interference in', c['hard_pairs_checked'], 'pairs, strict interlock')
          EOF
