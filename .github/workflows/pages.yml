name: Pages

# Builds site/ with the current hardware/assembly data, the v6 pages (hardware/v6) and photos, and publishes it to GitHub Pages.
# One-time setup by the repository owner: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (smaller photo previews), numpy and fast_simplification (v6 3D page)
        run: pip install pillow numpy fast_simplification

      - name: Build
        run: python site/build.py site/_build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
