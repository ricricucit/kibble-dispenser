name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cad:
    name: Regenerate parts and check meshes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAD dependencies
        run: pip install trimesh manifold3d shapely mapbox_earcut rtree numpy scipy networkx lxml matplotlib

      - name: Build the parts in a temporary copy of hardware/
        run: |
          tmp="$(mktemp -d)"
          cp -r hardware "$tmp/"
          python "$tmp/hardware/cad/build_drivetrain.py"
          python "$tmp/hardware/cad/build_disc_v2_chute.py"
          python "$tmp/hardware/cad/build_assembly.py"
          echo "HW_TMP=$tmp/hardware" >> "$GITHUB_ENV"

      - name: Check every mesh is closed
        run: python hardware/cad/check_meshes.py "$HW_TMP"

  cad-v6:
    name: Regenerate design v6 and check meshes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAD dependencies
        run: pip install trimesh manifold3d shapely mapbox_earcut rtree numpy scipy networkx lxml matplotlib

      # build_v6.py also runs build_dosing.py and build_v5.py (reused parts) and publishes stl/, 3mf/, assembly/
      - name: Build v6 in a temporary copy of hardware/v6
        run: |
          tmp="$(mktemp -d)"
          cp -r hardware/v6 "$tmp/"
          python "$tmp/v6/cad/build_v6.py"
          echo "V6_TMP=$tmp/v6" >> "$GITHUB_ENV"

      - name: Check every v6 mesh is closed
        run: python hardware/cad/check_meshes.py "$V6_TMP"

  site:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the v6 3D page dependencies
        run: pip install numpy fast_simplification

      - name: Build the site from the repository
        run: python site/build.py

  firmware:
    name: Lint the MicroPython firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Uses firmware/micropython/ruff.toml. The imported code is kept byte-for-byte as it came from
      # the owner's dev folder; its import order (I001) and the imports after BOOT_DELAY_S in main.py
      # (E402) are ignored here until a separate clean-up commit.
      - name: ruff check
        run: ruff check firmware/micropython/src --ignore I001,E402

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reuse
        run: pip install reuse

      - name: reuse lint
        run: reuse lint
