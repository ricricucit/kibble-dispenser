name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  meshes:
    name: Check the committed meshes of the chassis and the module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trimesh
        run: pip install trimesh numpy scipy networkx lxml

      # The full regeneration (about 15 to 25 minutes) runs in cad.yml when hardware/cad changes.
      - name: Check the viewer meshes, the module parts and every STL of the print package
        run: |
          python hardware/cad/check_meshes.py hardware
          python hardware/cad/check_meshes.py hardware/plates
          python hardware/cad/check_meshes.py hardware/module/case-1.0

  site:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the site dependencies (3D page, plate previews and photo thumbnails)
        run: pip install numpy fast_simplification pillow

      - name: Build the site from the repository
        run: python site/build.py

      - name: docs/BOM.md matches hardware/bom.json and the print package
        run: python site/bom.py --check

  firmware:
    name: Lint the MicroPython firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Uses firmware/micropython/ruff.toml. The imported code is kept byte-for-byte as it came from
      # the owner's dev folder; its import order (I001) and the imports after BOOT_DELAY_S in main.py
      # (E402) are ignored here until a separate clean-up commit.
      - name: ruff check
        run: ruff check firmware/micropython/src --ignore I001,E402

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reuse
        run: pip install reuse

      - name: reuse lint
        run: reuse lint
