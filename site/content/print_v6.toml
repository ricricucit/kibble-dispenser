[files.lead]
en = "Every part in print orientation. Multicolour parts also come as colour bodies in the same frame: load them together as one object with parts."
it = "Ogni pezzo già orientato per la stampa. I pezzi multicolore hanno anche i corpi per colore nello stesso riferimento: caricateli insieme come un oggetto con parti."
