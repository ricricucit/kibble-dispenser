[ams.note_spare]
en = "Black is about 84 % of all PETG, and plate 01 alone takes over 300 g. A second black spool in slot 4, with “Filament backup / auto refill” on, saves a failed print. No spare? Leave slot 4 empty."
it = "Il nero è circa l'84 % di tutto il PETG, e il solo piatto 01 ne usa più di 300 g. Una seconda bobina nera nello slot 4, con “Backup filamento / ricarica automatica” attivo, evita una stampa fallita. Niente scorta? Lasciate vuoto lo slot 4."
de = "Schwarz ist etwa 84 % des ganzen PETG, und Platte 01 allein braucht über 300 g. Eine zweite schwarze Spule in Slot 4 mit „Filament-Backup / Auto-Nachfüllen“ rettet einen Druck. Keine Reserve? Slot 4 leer lassen."

[ams.note_tpu]
en = "TPU can't go through the AMS lite. Put it on the external spool holder, map it to “External spool” in the print dialog, and print it on its own plate."
it = "Il TPU non può passare dall'AMS lite. Mettetelo sul supporto bobina esterno, assegnatelo a “Bobina esterna” nella finestra di stampa e stampatelo sul suo piatto."
de = "TPU kann nicht durch das AMS lite. Spannt es auf den externen Spulenhalter, wählt im Druckdialog „Externe Spule“ und druckt es auf seiner eigenen Platte."

# ------------------------------------------------------------------ test pieces
[test.title]
en = "Print the test pieces first"
it = "Prima stampate i pezzi di prova"
de = "Zuerst die Testteile drucken"

[test.lead]
en = "Two short plates tell you how the parts will fit your servo and your filament, before you spend 25 hours on the rest."
it = "Due piatti brevi vi dicono come i pezzi si adatteranno al vostro servo e al vostro filamento, prima di spendere 25 ore per il resto."
de = "Zwei kurze Platten zeigen, wie die Teile zu eurem Servo und eurem Filament passen, bevor ihr 25 Stunden in den Rest steckt."

[[test.steps]]
[test.steps.title]
en = "Spline coupons and cover groove (plate PETG-0)"
it = "Provini dello scanalato e gola del fondello (piatto PETG-0)"
de = "Verzahnungsproben und Deckelnut (Platte PETG-0)"
[test.steps.body]
en = "Three coupons with 1, 2 or 3 notches: 0.05, 0.10 or 0.20 mm clearance on the 25-tooth servo spline. Push each onto the servo by hand: the right one slides on with light pressure and doesn't wobble. The hub is built with 0.10 mm (2 notches)."
it = "Tre provini con 1, 2 o 3 tacche: 0,05, 0,10 o 0,20 mm di gioco sullo scanalato a 25 denti del servo. Infilateli a mano sul servo: quello giusto entra con poca pressione e non balla. Il mozzo è fatto con 0,10 mm (2 tacche)."
de = "Drei Proben mit 1, 2 oder 3 Kerben: 0,05, 0,10 oder 0,20 mm Spiel auf der 25-Zahn-Servoverzahnung. Steckt jede von Hand auf den Servo: die richtige gleitet mit leichtem Druck drauf und wackelt nicht. Die Nabe ist mit 0,10 mm gebaut (2 Kerben)."

[[test.steps]]
[test.steps.title]
en = "TPU lip strip (plate TPU-0)"
it = "Striscia del labbro in TPU (piatto TPU-0)"
de = "TPU-Lippenstreifen (Platte TPU-0)"
[test.steps.body]
en = "A 40 mm cut of the cover seal. It should press fully into the groove coupon, its lip should stand about 30° inward without strings, and spring back when you bend it flat."
it = "Un pezzo di 40 mm della guarnizione del fondello. Deve entrare del tutto nella gola del provino, il labbro deve stare inclinato di circa 30° verso l'interno senza fili e tornare su quando lo piegate."
de = "Ein 40-mm-Stück der Deckeldichtung. Es soll ganz in die Nutprobe passen, die Lippe soll etwa 30° nach innen stehen, ohne Fäden, und zurückfedern, wenn man sie flach biegt."

[[test.steps]]
[test.steps.title]
en = "After assembly: hose test"
it = "Dopo il montaggio: prova con la canna"
de = "Nach der Montage: Schlauchtest"
[test.steps.body]
en = "Close the empty box and spray it with a garden hose before any electronics go inside."
it = "Chiudete la scatola vuota e bagnatela con la canna da giardino prima di metterci l'elettronica."
de = "Das leere Gehäuse schließen und mit dem Gartenschlauch abspritzen, bevor Elektronik hineinkommt."

# ------------------------------------------------------------------ plates
[plates.title]
en = "The plates"
it = "I piatti"
de = "Die Platten"

[plates.lead]
en = "Each plate follows one body colour, so colour swaps only happen in the few inlay layers. Times and grams are slicer estimates including supports, prime tower and flushing; Bambu Studio may differ by 5 to 10 %."
it = "Ogni piatto segue un solo colore di base, così i cambi colore avvengono solo nei pochi strati delle scritte. Tempi e grammi sono stime dello slicer con supporti, torre di spurgo e spurghi; Bambu Studio può dare il 5-10 % in più o in meno."
de = "Jede Platte folgt einer Grundfarbe, so gibt es Farbwechsel nur in den wenigen Inlay-Schichten. Zeiten und Gramm sind Slicer-Schätzungen mit Stützen, Reinigungsturm und Spülen; Bambu Studio kann 5 bis 10 % abweichen."

