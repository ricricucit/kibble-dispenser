[notes.title]
en = "Good to know"
it = "Buono a sapersi"
de = "Gut zu wissen"

[notes.items]
items = [
  { en = "The TPU plate still contains the old plate lips and the old bayonet gasket. Both are being redesigned.", it = "Il piatto TPU contiene ancora i vecchi labbri delle piastre e la vecchia guarnizione della baionetta. Entrambi sono in riprogettazione.", de = "Die TPU-Platte enthält noch die alten Plattenlippen und die alte Bajonett-Dichtung. Beide werden neu konstruiert." },
  { en = "The projects are written by a script in the Bambu Studio format and validated by slicing in OrcaSlicer 2.5. Open them once in Bambu Studio (2.5 or newer) and check the plate list and the filament mapping.", it = "I progetti sono scritti da uno script nel formato di Bambu Studio e validati facendo lo slicing in OrcaSlicer 2.5. Apriteli una volta in Bambu Studio (2.5 o più recente) e controllate l'elenco dei piatti e l'assegnazione dei filamenti.", de = "Die Projekte werden von einem Skript im Bambu-Studio-Format geschrieben und durch Slicen in OrcaSlicer 2.5 geprüft. Öffnet sie einmal in Bambu Studio (2.5 oder neuer) und prüft Plattenliste und Filamentzuordnung." },
  { en = "If another spline coupon fits better than the 2-notch one, change the clearance in the CAD script and rebuild the hub before printing plate 01.", it = "Se un altro provino dello scanalato va meglio di quello a 2 tacche, cambiate il gioco nello script CAD e rigenerate il mozzo prima di stampare il piatto 01.", de = "Passt eine andere Verzahnungsprobe besser als die mit 2 Kerben, ändert das Spiel im CAD-Skript und baut die Nabe neu, bevor ihr Platte 01 druckt." },
]

