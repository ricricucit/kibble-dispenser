[notes.title]
en = "Good to know"
it = "Buono a sapersi"
de = "Gut zu wissen"

[notes.items]
items = [
  { en = "These print files are the authoritative print set of v6.2. They lay four parts differently from the CAD exports, with less overhang: the channel base flipped (wood face on the bed), the channel cover open side up, the channel end cap on its other side and the cable grommet lip down.", it = "Questi file sono il set di stampa di riferimento della v6.2. Dispongono quattro pezzi in modo diverso dagli export CAD, con meno sbalzi: la base della canalina capovolta (faccia per il legno sul piatto), il coperchio della canalina col lato aperto in su, il tappo della canalina sull'altro fianco e il passacavo col labbro in basso.", de = "Diese Druckdateien sind der maßgebliche Drucksatz von v6.2. Vier Teile liegen anders als in den CAD-Exporten, mit weniger Überhang: das Kanal-Unterteil gewendet (Holzseite auf dem Bett), der Kanaldeckel mit der offenen Seite nach oben, die Endkappe auf der anderen Seite und die Kabeltülle mit der Lippe nach unten." },
  { en = "The lower flange plate is printed without the Ø4 pivot pin of the gate, which would stand on the bed face: it gets a Ø4.0 × 2.7 mm hole for a pressed-in stainless dowel Ø4 × 6 (ISO 2338), listed with the bought parts. The unmodified CAD file is in the ZIP as flangia_piano_v62_print_cad_original.stl.", it = "La flangia inferiore si stampa senza il perno Ø4 della saracinesca, che starebbe sulla faccia appoggiata al piatto: ha invece un foro Ø4,0 × 2,7 mm per una spina inox Ø4 × 6 (ISO 2338) piantata a pressione, che trovate tra i pezzi da comprare. Il file CAD non modificato è nello ZIP come flangia_piano_v62_print_cad_original.stl.", de = "Der untere Flansch wird ohne den Ø4-Drehstift des Schiebers gedruckt, der auf der Bettseite stehen würde: er bekommt ein Loch Ø4,0 × 2,7 mm für einen eingepressten Edelstahlstift Ø4 × 6 (ISO 2338), der bei den Zukaufteilen steht. Die unveränderte CAD-Datei liegt in der ZIP als flangia_piano_v62_print_cad_original.stl." },
  { en = "The 28 mm window of the orange ring is a bridge when printed on edge, so a small support stands on its sill (support enforcer).", it = "La finestra da 28 mm dell'anello arancione è un ponte quando si stampa di taglio, quindi un piccolo supporto poggia sul suo davanzale (rinforzo dei supporti).", de = "Das 28-mm-Fenster des orangen Rings ist hochkant gedruckt eine Brücke, deshalb steht eine kleine Stütze auf seiner Unterkante (Stützenverstärker)." },
  { en = "If another spline coupon fits better than the 2-notch one, change the clearance in the CAD script, rebuild the hub and run tools/run_all.sh before printing plate 04.", it = "Se un altro provino dello scanalato va meglio di quello a 2 tacche, cambiate il gioco nello script CAD, rigenerate il mozzo e lanciate tools/run_all.sh prima di stampare il piatto 04.", de = "Passt eine andere Verzahnungsprobe besser als die mit 2 Kerben, ändert das Spiel im CAD-Skript, baut die Nabe neu und startet tools/run_all.sh, bevor ihr Platte 04 druckt." },
]

