[dl.check]
en = "Checked by slicing every plate with OrcaSlicer 2.5, without errors or warnings. The projects have not been opened in Bambu Studio yet: open them there once, check the plate list and the filament mapping, and slice once before you print."
it = "Verificati facendo lo slicing di ogni piatto con OrcaSlicer 2.5, senza errori né avvisi. I progetti non sono ancora stati aperti in Bambu Studio: apriteli lì una volta, controllate l'elenco dei piatti e l'assegnazione dei filamenti e fate lo slicing prima di stampare."
de = "Geprüft durch Slicen jeder Platte mit OrcaSlicer 2.5, ohne Fehler oder Warnungen. In Bambu Studio wurden die Projekte noch nicht geöffnet: öffnet sie dort einmal, prüft Plattenliste und Filamentzuordnung und slict einmal, bevor ihr druckt."

[dl.other]
en = "Other slicers: use the plain 3MF of each plate below, or the single STL files. Colour bodies are named after their colour; assign the filaments and the settings yourself, because a plain 3MF carries no settings, modifiers or support enforcers."
it = "Altri slicer: usate il 3MF semplice di ogni piatto qui sotto, oppure i singoli STL. Le parti colorate hanno il nome del colore; assegnate voi filamenti e impostazioni, perché un 3MF semplice non porta impostazioni, modificatori né rinforzi dei supporti."
de = "Andere Slicer: nehmt die einfache 3MF jeder Platte unten oder die einzelnen STL. Die Farbkörper heißen nach ihrer Farbe; Filamente und Einstellungen ordnet ihr selbst zu, denn eine einfache 3MF enthält keine Einstellungen, Modifikatoren oder Stützenverstärker."

