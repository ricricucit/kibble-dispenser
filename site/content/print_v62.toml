  { en = "Process 0.20mm Standard @BBL A1", it = "Processo 0.20mm Standard @BBL A1", de = "Prozess 0.20mm Standard @BBL A1" },
  { en = "Parts keep at least 5 mm from each other and stay clear of the A1 calibration line at the front edge", it = "I pezzi restano ad almeno 5 mm l'uno dall'altro e lontani dalla linea di calibrazione della A1 sul bordo anteriore", de = "Die Teile halten mindestens 5 mm Abstand und bleiben weg von der Kalibrierlinie des A1 am vorderen Rand" },
]

