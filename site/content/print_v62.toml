  { en = "Dry open spools at 65 °C for 6 to 8 h: wet PETG strings and spoils the inlays", it = "Asciugate le bobine aperte a 65 °C per 6-8 h: il PETG umido fa fili e rovina le scritte", de = "Offene Spulen 6 bis 8 h bei 65 °C trocknen: feuchtes PETG zieht Fäden und verdirbt die Inlays" },
