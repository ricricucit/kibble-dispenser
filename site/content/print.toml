# ------------------------------------------------------------------ settings
[settings.title]
en = "Settings"
it = "Impostazioni"
de = "Einstellungen"

[settings.lead]
en = "Already stored in the Bambu projects, as presets and per-object settings. Use the same values in other slicers."
it = "Già salvate nei progetti Bambu, come preset e impostazioni per oggetto. Usate gli stessi valori negli altri slicer."
de = "In den Bambu-Projekten schon gespeichert, als Profile und Objekteinstellungen. Nehmt in anderen Slicern dieselben Werte."

[settings.printer]
title = { en = "Printer", it = "Stampante", de = "Drucker" }
items = [
  { en = "Bambu Lab A1, 0.4 mm nozzle, Textured PEI plate", it = "Bambu Lab A1, ugello 0,4 mm, piatto Textured PEI", de = "Bambu Lab A1, 0,4-mm-Düse, Textured-PEI-Platte" },
  { en = "Process 0.20mm Standard @BBL A1", it = "Processo 0.20mm Standard @BBL A1", de = "Prozess 0.20mm Standard @BBL A1" },
  { en = "Parts keep at least 5 mm from each other and stay clear of the A1 calibration line at the front edge", it = "I pezzi restano ad almeno 5 mm l'uno dall'altro e lontani dalla linea di calibrazione della A1 sul bordo anteriore", de = "Die Teile halten mindestens 5 mm Abstand und bleiben weg von der Kalibrierlinie des A1 am vorderen Rand" },
]

[settings.petg]
title = { en = "PETG", it = "PETG", de = "PETG" }
items = [
  { en = "Generic PETG @BBL A1, or your brand's profile", it = "Generic PETG @BBL A1, o il profilo della vostra marca", de = "Generic PETG @BBL A1 oder das Profil eurer Marke" },
  { en = "Nozzle 255 °C, bed 80 °C on Textured PEI; glue stick on smooth PEI", it = "Ugello 255 °C, piatto 80 °C su Textured PEI; colla stick sul PEI liscio", de = "Düse 255 °C, Bett 80 °C auf Textured PEI; Klebestift auf glattem PEI" },
  { en = "0.20 mm layers: the colour inlays are exactly 3 layers. Only the shaft uses 0.15 mm", it = "Strati da 0,20 mm: le scritte colorate sono esattamente 3 strati. Solo l'albero usa 0,15 mm", de = "0,20-mm-Schichten: die Farbinlays sind genau 3 Schichten. Nur die Welle nutzt 0,15 mm" },
  { en = "Dry open spools at 65 °C for 6 to 8 h: wet PETG strings and spoils the inlays", it = "Asciugate le bobine aperte a 65 °C per 6-8 h: il PETG umido fa fili e rovina le scritte", de = "Offene Spulen 6 bis 8 h bei 65 °C trocknen: feuchtes PETG zieht Fäden und verdirbt die Inlays" },
]

[settings.tpu]
title = { en = "TPU 95A", it = "TPU 95A", de = "TPU 95A" }
items = [
  { en = "Generic TPU @BBL A1 or Bambu TPU 95A HF", it = "Generic TPU @BBL A1 o Bambu TPU 95A HF", de = "Generic TPU @BBL A1 oder Bambu TPU 95A HF" },
  { en = "Nozzle 240 °C, bed 45 °C, fan 100 %, at most 3.2 mm³/s", it = "Ugello 240 °C, piatto 45 °C, ventola 100 %, al massimo 3,2 mm³/s", de = "Düse 240 °C, Bett 45 °C, Lüfter 100 %, höchstens 3,2 mm³/s" },
  { en = "100 % infill and 2 walls on every seal; the thin flaps use Arachne walls at 15 mm/s", it = "Riempimento 100 % e 2 pareti su ogni guarnizione; i labbri sottili usano pareti Arachne a 15 mm/s", de = "100 % Füllung und 2 Wände bei jeder Dichtung; die dünnen Lippen mit Arachne-Wänden bei 15 mm/s" },
  { en = "Dry it at 65 °C for 6 h right before printing", it = "Asciugatelo a 65 °C per 6 h subito prima di stampare", de = "Direkt vor dem Druck 6 h bei 65 °C trocknen" },
]

