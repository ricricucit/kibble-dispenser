de = "Alle STL zeigen"

[notes.title]
en = "Good to know"
it = "Buono a sapersi"
de = "Gut zu wissen"

[notes.items]
items = [
  { en = "Since 6.3.0 the CAD itself carries the print orientations and the Ø4 dowel hole of the lower flange plate (v6.2 needed corrections in its print package). They were checked by slicing and used as they are.", it = "Dalla 6.3.0 il CAD stesso contiene gli orientamenti di stampa e il foro Ø4 per la spina della flangia inferiore (la v6.2 chiedeva correzioni nel suo pacchetto di stampa). Sono stati verificati con lo slicing e usati così.", de = "Seit 6.3.0 enthält das CAD selbst die Druckausrichtungen und das Ø4-Stiftloch des unteren Flanschs (v6.2 brauchte Korrekturen im Druckpaket). Sie wurden durch Slicen geprüft und so verwendet." },
  { en = "No support enforcers any more: the box needs no support, and the window of the orange ring is now a teardrop that prints on its own.", it = "Niente più rinforzi dei supporti: la scatola non chiede supporti, e la finestra dell'anello arancione ora è a goccia e si stampa da sola.", de = "Keine Stützenverstärker mehr: das Gehäuse braucht keine Stützen, und das Fenster des orangen Rings ist jetzt tropfenförmig und druckt von selbst." },
  { en = "The raw CAD file of the cap has four zero-area slivers; the mesh clean of the package removes them, so the cap is one watertight solid in all files.", it = "Il file CAD grezzo del fondello ha quattro schegge di area nulla; la pulizia della mesh del pacchetto le toglie, così il fondello è un solido chiuso in tutti i file.", de = "Die rohe CAD-Datei des Bodens hat vier Splitter ohne Fläche; die Netzbereinigung des Pakets entfernt sie, der Boden ist in allen Dateien ein geschlossener Körper." },
  { en = "If another spline coupon fits better than the 2-notch one, change the clearance in the CAD script, rebuild the hub and run tools/run_all.sh before printing plate 03.", it = "Se un altro provino dello scanalato va meglio di quello a 2 tacche, cambiate il gioco nello script CAD, rigenerate il mozzo e lanciate tools/run_all.sh prima di stampare il piatto 03.", de = "Passt eine andere Verzahnungsprobe besser als die mit 2 Kerben, ändert das Spiel im CAD-Skript, baut die Nabe neu und startet tools/run_all.sh, bevor ihr Platte 03 druckt." },
]

