# ------------------------------------------------------------------ IP66 settings (current design and v6.2)
[ip66.title]
en = "IP66 settings: box and cap"
it = "Impostazioni IP66: scatola e fondello"
de = "IP66-Einstellungen: Gehäuse und Boden"

[ip66.lead]
en = "The electronics box and the pod cap keep the water out, so they print solid and slightly over-extruded. The projects already carry these settings; in another slicer set them by hand."
it = "La scatola elettronica e il fondello tengono fuori l'acqua, quindi si stampano pieni e leggermente sovraestrusi. I progetti hanno già queste impostazioni; in un altro slicer mettetele a mano."
de = "Elektronikgehäuse und Boden halten das Wasser draußen, deshalb drucken sie massiv und leicht überextrudiert. Die Projekte enthalten diese Einstellungen schon; in einem anderen Slicer stellt ihr sie von Hand ein."

[ip66.settings]
title = { en = "Settings", it = "Impostazioni", de = "Einstellungen" }
items = [
  { en = "5 walls at 0.42 mm line width, 100 % infill, 5 top and 5 bottom layers, seam at the back", it = "5 pareti con linea da 0,42 mm, riempimento 100 %, 5 strati sopra e 5 sotto, cucitura dietro", de = "5 Wände mit 0,42 mm Linienbreite, 100 % Füllung, 5 Schichten oben und unten, Naht hinten" },
  { en = "Object flow ratio 1.03 (+3 %)", it = "Rapporto di flusso dell'oggetto 1,03 (+3 %)", de = "Flussrate des Objekts 1,03 (+3 %)" },
  { en = "Box: top surfaces ironed; no support at all", it = "Scatola: superfici superiori stirate; nessun supporto", de = "Gehäuse: Oberseiten gebügelt; keine Stützen" },
  { en = "Cap: a bed-only support ring under the lowest 5 mm of its rounded bottom edge; the control panel, its flush knock-outs and the dry pocket print without support", it = "Fondello: un anello di supporto solo dal piatto sotto i 5 mm più bassi del bordo arrotondato; il pannello comandi, le predisposizioni a filo e la tasca asciutta si stampano senza supporti", de = "Boden: ein Stützring nur vom Bett unter den untersten 5 mm der gerundeten Unterkante; Bedienfeld, bündige Ausbrüche und trockene Tasche drucken ohne Stützen" },
  { en = "For these two plates: nozzle 245 to 250 °C and part fan at 40 % or less, for strong layer bonding", it = "Per questi due piatti: ugello 245-250 °C e ventola del pezzo al 40 % o meno, per un buon legame tra gli strati", de = "Für diese zwei Platten: Düse 245 bis 250 °C und Bauteillüfter höchstens 40 %, für gute Schichthaftung" },
]

[ip66.after]
title = { en = "After printing", it = "Dopo la stampa", de = "Nach dem Druck" }
items = [
  { en = "Clear the drain holes of the cap (Ø0.8 mm, two labyrinth drains) with a 0.8 mm drill: first-layer squish can close them", it = "Liberate i fori di scarico del fondello (Ø0,8 mm, due drenaggi a labirinto) con una punta da 0,8 mm: lo schiacciamento del primo strato può chiuderli", de = "Die Ablauflöcher des Bodens (Ø0,8 mm, zwei Labyrinth-Abläufe) mit einem 0,8-mm-Bohrer freibohren: die erste Schicht kann sie zudrücken" },
  { en = "Hold the empty box against a bright light in a dark room: pinholes glow", it = "Tenete la scatola vuota davanti a una luce forte in una stanza buia: i forellini si vedono brillare", de = "Das leere Gehäuse im dunklen Raum gegen eine helle Lampe halten: Nadellöcher leuchten" },
  { en = "Check that the gland pad, a vertical face that cannot be ironed, is flat where the gland O-ring seats", it = "Controllate che la piazzola del pressacavo, una faccia verticale che non si può stirare, sia piana dove appoggia l'O-ring", de = "Prüfen, dass die Fläche der Kabelverschraubung, eine senkrechte und nicht bügelbare Fläche, dort eben ist, wo der O-Ring sitzt" },
]

