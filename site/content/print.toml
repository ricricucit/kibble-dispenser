[final]
title = { en = "Step 14: final checks before assembly", it = "Passo 14: controlli finali prima del montaggio", de = "Schritt 14: Schlusskontrollen vor der Montage" }
items = [
  { en = "Tick every part in the check list below.", it = "Spuntate ogni pezzo nella lista di controllo qui sotto.", de = "Hakt jedes Teil in der Checkliste unten ab." },
  { en = "Press the rim lip seal into the bowl groove, the skirt lip into the lower flange plate and the servo-bay lip seal into the cap. Each must seat all round.", it = "Premete il labbro del bordo nella gola della vasca, il bordino nella flangia inferiore e il labbro del vano servo nel fondello. Ognuno deve sedersi tutto intorno.", de = "Drückt die Randlippe in die Nut der Schale, die Schürzenlippe in den unteren Flansch und die Servofachlippe in den Boden. Jede muss rundum sitzen." },
  { en = "Push the cap onto the servo bay without screws: the cap lip touches the bay rim all round.", it = "Infilate il fondello sul vano servo senza viti: il labbro tocca il bordo del vano tutto intorno.", de = "Steckt den Boden ohne Schrauben auf das Servofach: die Lippe berührt den Fachrand rundum." },
  { en = "Slide the empty module up into the chassis: it moves freely, the two sockets find the posts over the last 18 mm, and the seams to the cap and the shell are even (0.35 mm). Hold the module when it leaves the posts on the way out.", it = "Fate salire il modulo vuoto nel telaio: scorre libero, le due sedi trovano le colonnine negli ultimi 18 mm e le fessure verso fondello e guscio sono regolari (0,35 mm). Tenete il modulo quando lascia le colonnine all'uscita.", de = "Schiebt das leere Modul von unten ins Gehäuse: es läuft frei, die zwei Buchsen finden die Säulen auf den letzten 18 mm, und die Fugen zu Boden und Hülle sind gleichmäßig (0,35 mm). Haltet das Modul fest, wenn es beim Herausziehen die Säulen verlässt." },
  { en = "Drive each PT screw by hand (about 0.6 N·m) and open each PT joint at most 5 times. Tighten the M3 × 40 stack screws to 0.4 N·m and the two M3 × 16 module screws to 0.5 N·m.", it = "Avvitate ogni vite PT a mano (circa 0,6 N·m) e aprite ogni giunto PT al massimo 5 volte. Stringete le viti M3 × 40 del pacco a 0,4 N·m e le due viti M3 × 16 del modulo a 0,5 N·m.", de = "Dreht jede PT-Schraube von Hand ein (etwa 0,6 N·m) und öffnet jede PT-Verbindung höchstens 5-mal. Zieht die M3 × 40-Stapelschrauben mit 0,4 N·m und die zwei M3 × 16-Modulschrauben mit 0,5 N·m an." },
  { en = "Hose-test the closed servo bay with its cap, and the closed module, before any electronics go inside.", it = "Provate col getto d'acqua il vano servo chiuso con il suo fondello e il modulo chiuso, prima di metterci dentro l'elettronica.", de = "Prüft das geschlossene Servofach mit Boden und das geschlossene Modul mit dem Schlauch, bevor Elektronik hineinkommt." },
]

