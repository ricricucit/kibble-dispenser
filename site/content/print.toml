[ams.note_spare]
en = "Black is about 82 % of all PETG, and plates 01 and 02 take about 250 and 300 g. A second black spool in slot 4, with “Filament backup / auto refill” on, saves a failed print. No spare? Leave slot 4 empty."
it = "Il nero è circa l'82 % di tutto il PETG, e i piatti 01 e 02 ne usano circa 250 e 300 g. Una seconda bobina nera nello slot 4, con “Backup filamento / ricarica automatica” attivo, evita una stampa fallita. Niente scorta? Lasciate vuoto lo slot 4."
de = "Schwarz ist etwa 82 % des ganzen PETG, und die Platten 01 und 02 brauchen etwa 250 und 300 g. Eine zweite schwarze Spule in Slot 4 mit „Filament-Backup / Auto-Nachfüllen“ rettet einen Druck. Keine Reserve? Slot 4 leer lassen."

[ams.note_tpu]
en = "TPU can't go through the AMS lite. Put it on the external spool holder, map it to “External spool” in the print dialog, and print it on its own plates."
it = "Il TPU non può passare dall'AMS lite. Mettetelo sul supporto bobina esterno, assegnatelo a “Bobina esterna” nella finestra di stampa e stampatelo sui suoi piatti."
de = "TPU kann nicht durch das AMS lite. Spannt es auf den externen Spulenhalter, wählt im Druckdialog „Externe Spule“ und druckt es auf seinen eigenen Platten."

# ------------------------------------------------------------------ test pieces
[test.title]
en = "Print the test pieces first"
it = "Prima stampate i pezzi di prova"
de = "Zuerst die Testteile drucken"

[test.lead]
en = "Two short plates, about 45 minutes together, tell you how the parts will fit your servo and your filament before you spend nearly 40 hours on the rest."
it = "Due piatti brevi, circa 45 minuti in tutto, vi dicono come i pezzi si adatteranno al vostro servo e al vostro filamento prima di spendere quasi 40 ore per il resto."
de = "Zwei kurze Platten, zusammen etwa 45 Minuten, zeigen, wie die Teile zu eurem Servo und eurem Filament passen, bevor ihr fast 40 Stunden in den Rest steckt."

[[test.steps]]
[test.steps.title]
en = "Spline coupons and groove coupons (plate PETG-0)"
it = "Provini dello scanalato e delle gole (piatto PETG-0)"
de = "Verzahnungs- und Nutproben (Platte PETG-0)"
[test.steps.body]
en = "Three spline coupons with 1, 2 or 3 notches: 0.05, 0.10 or 0.20 mm clearance on the 25-tooth servo spline. The right one slides on by hand with light pressure and doesn't wobble; the hub is built with 0.10 mm (2 notches). The other three pieces are short cuts of the bowl rim, the cap upstand and the flange skirt, with their seal grooves."
it = "Tre provini dello scanalato con 1, 2 o 3 tacche: 0,05, 0,10 o 0,20 mm di gioco sullo scanalato a 25 denti del servo. Quello giusto entra a mano con poca pressione e non balla; il mozzo è fatto con 0,10 mm (2 tacche). Gli altri tre pezzi sono brevi tagli del bordo della vasca, del rialzo del fondello e del bordo della flangia, con le loro gole per le guarnizioni."
de = "Drei Verzahnungsproben mit 1, 2 oder 3 Kerben: 0,05, 0,10 oder 0,20 mm Spiel auf der 25-Zahn-Servoverzahnung. Die richtige gleitet von Hand mit leichtem Druck drauf und wackelt nicht; die Nabe ist mit 0,10 mm gebaut (2 Kerben). Die drei anderen Stücke sind kurze Abschnitte von Schalenrand, Bodenaufkantung und Flanschschürze mit ihren Dichtungsnuten."

[[test.steps]]
[test.steps.title]
en = "TPU lip strips (plate TPU-0)"
it = "Strisce dei labbri in TPU (piatto TPU-0)"
de = "TPU-Lippenstreifen (Platte TPU-0)"
[test.steps.body]
en = "Short pieces of the rim lip, the cap lip, the skirt lip and one comb lip. Press each into its groove coupon: the anchor should seat fully, and the thin flap should be one clean, closed line that springs back. On the comb lip the slits must be open."
it = "Brevi pezzi del labbro del bordo, del labbro del fondello, del bordino e un labbro a pettine. Premete ciascuno nella gola del suo provino: l'ancoraggio deve entrare del tutto e il labbro sottile deve essere una linea pulita e chiusa che torna su. Nel labbro a pettine i tagli devono essere aperti."
de = "Kurze Stücke von Randlippe, Bodenlippe, Schürzenlippe und eine Kammlippe. Drückt jedes in seine Nutprobe: der Anker soll ganz sitzen, und die dünne Lippe soll eine saubere, geschlossene Linie sein, die zurückfedert. Bei der Kammlippe müssen die Schlitze offen sein."

[[test.steps]]
[test.steps.title]
en = "After assembly: hose test"
it = "Dopo il montaggio: prova con la canna"
de = "Nach der Montage: Schlauchtest"
[test.steps.body]
en = "Close the empty pod and spray it with a garden hose before any electronics go inside. Drive the PT screws by hand (about 0.6 N·m, at most about 5 times per hole); tighten the three M3 × 40 stack screws to 0.4 N·m and check them again after a week: printed PETG creeps a little under load."
it = "Chiudete il guscio vuoto e bagnatelo con la canna da giardino prima di metterci l'elettronica. Avvitate le viti PT a mano (circa 0,6 N·m, al massimo 5 volte circa per foro); stringete le tre viti M3 × 40 del pacco a 0,4 N·m e ricontrollatele dopo una settimana: il PETG stampato sotto carico cede un poco."
de = "Die leere Hülle schließen und mit dem Gartenschlauch abspritzen, bevor Elektronik hineinkommt. Die PT-Schrauben von Hand eindrehen (etwa 0,6 N·m, höchstens etwa 5-mal pro Loch); die drei M3×40-Stapelschrauben mit 0,4 N·m anziehen und nach einer Woche nachprüfen: gedrucktes PETG kriecht unter Last ein wenig."

# ------------------------------------------------------------------ plates
[plates.title]
en = "The plates"
it = "I piatti"
de = "Die Platten"

[plates.lead]
en = "Each plate follows one body colour, so colour swaps only happen in the few inlay layers: 18 in total, down from 33. Times and grams are slicer estimates including supports, prime tower and flushing; Bambu Studio may differ by 5 to 10 %."
it = "Ogni piatto segue un solo colore di base, così i cambi colore avvengono solo nei pochi strati delle scritte: 18 in tutto, invece di 33. Tempi e grammi sono stime dello slicer con supporti, torre di spurgo e spurghi; Bambu Studio può dare il 5-10 % in più o in meno."
de = "Jede Platte folgt einer Grundfarbe, so gibt es Farbwechsel nur in den wenigen Inlay-Schichten: insgesamt 18 statt 33. Zeiten und Gramm sind Slicer-Schätzungen mit Stützen, Reinigungsturm und Spülen; Bambu Studio kann 5 bis 10 % abweichen."

