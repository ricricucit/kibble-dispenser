[notes]
title = { en = "Good to know", it = "Buono a sapersi", de = "Gut zu wissen" }
guide = { en = "Full print guide (English)", it = "Guida di stampa completa (in inglese)", de = "Vollständige Druckanleitung (Englisch)" }
github = { en = "Print files on GitHub", it = "File di stampa su GitHub", de = "Druckdateien auf GitHub" }
items = [
  { en = "Times and grams are OrcaSlicer 2.5 estimates with the Bambu A1 profiles, including supports, prime tower and flushing. Bambu Studio may differ by 5 to 10 %.", it = "Tempi e grammi sono stime di OrcaSlicer 2.5 con i profili Bambu A1, supporti, torre di spurgo e spurghi compresi. Bambu Studio può differire del 5–10 %.", de = "Zeiten und Gramm sind Schätzungen von OrcaSlicer 2.5 mit den Bambu-A1-Profilen, inklusive Stützen, Reinigungsturm und Spülen. Bambu Studio kann 5 bis 10 % abweichen." },
  { en = "The M8 5-pin panel socket of the module is assumed with an 8.2 mm hole and a nut up to 13 mm across flats: measure yours before you print the lid.", it = "Per la presa M8 5 poli del modulo si ipotizzano un foro da 8,2 mm e un dado fino a 13 mm: misurate la vostra prima di stampare il coperchio.", de = "Für die M8-Einbaubuchse 5-polig des Moduls sind ein 8,2-mm-Loch und eine Mutter bis 13 mm SW angenommen: messt eure vor dem Druck des Deckels nach." },
  { en = "Plain 3MF files carry no settings, supports or enforcers: in other slicers set them by hand from the steps above.", it = "I 3MF semplici non contengono impostazioni, supporti o rinforzi: in altri slicer impostateli a mano seguendo i passi sopra.", de = "Einfache 3MF enthalten keine Einstellungen, Stützen oder Verstärker: in anderen Slicern stellt ihr sie nach den Schritten oben von Hand ein." },
]
[ams.title]
en = "AMS lite setup"
it = "Configurazione AMS lite"
de = "AMS-lite-Belegung"

[ams.lead]
en = "Load the spools like this before you open the PETG project. The colours mean the same as on the dispenser."
it = "Caricate le bobine così prima di aprire il progetto PETG. I colori hanno lo stesso significato che sul distributore."
de = "Legt die Spulen so ein, bevor ihr das PETG-Projekt öffnet. Die Farben bedeuten dasselbe wie am Spender."

