[ams_spare]
en = "Black is about 83 % of all PETG, and the shell and the bowl take about 160 g each. A second black spool in slot 4, with “Filament backup / auto refill” on, saves a failed print. No spare? Leave slot 4 empty."
it = "Il nero è circa l'83 % di tutto il PETG, e il guscio e la vasca ne usano circa 160 g ciascuno. Una seconda bobina nera nello slot 4, con “Backup filamento / ricarica automatica” attivo, evita una stampa fallita. Niente scorta? Lasciate vuoto lo slot 4."
de = "Schwarz ist etwa 83 % des ganzen PETG, und Hülle und Schale brauchen je etwa 160 g. Eine zweite schwarze Spule in Slot 4 mit „Filament-Backup / Auto-Nachfüllen“ rettet einen Druck. Keine Reserve? Slot 4 leer lassen."

[step0]
title = { en = "Step 0: before the first print", it = "Passo 0: prima della prima stampa", de = "Schritt 0: vor dem ersten Druck" }
items = [
  { en = "Filament: about {black} of PETG black, {green} of green, {orange} of orange and {tpu} of TPU 95A yellow, test plates included.", it = "Filamento: circa {black} di PETG nero, {green} di verde, {orange} di arancione e {tpu} di TPU 95A giallo, piatti di prova compresi.", de = "Filament: etwa {black} PETG schwarz, {green} grün, {orange} orange und {tpu} TPU 95A gelb, Testplatten eingerechnet." },
  { en = "Dry the filament: PETG from an open spool at 65 °C for 6 to 8 hours; TPU at 65 to 70 °C for 6 to 8 hours right before printing, every time. Wet TPU makes strings and bubbles, and the thin sealing lips fail.", it = "Asciugate il filamento: il PETG di una bobina aperta a 65 °C per 6–8 ore; il TPU a 65–70 °C per 6–8 ore subito prima di stampare, ogni volta. Il TPU umido fa fili e bolle, e i labbri sottili di tenuta non funzionano.", de = "Filament trocknen: PETG von einer offenen Spule 6 bis 8 Stunden bei 65 °C; TPU jedes Mal direkt vor dem Druck 6 bis 8 Stunden bei 65 bis 70 °C. Feuchtes TPU zieht Fäden und Blasen, und die dünnen Dichtlippen versagen." },
  { en = "Load the AMS lite as shown above and turn on “Filament backup”. TPU goes on the external spool holder: choose “External spool” in the print dialog.", it = "Caricate l'AMS lite come sopra e attivate “Backup filamento”. Il TPU va sul supporto bobina esterno: scegliete “Bobina esterna” nella finestra di stampa.", de = "Belegt das AMS lite wie oben und schaltet „Filament-Backup“ ein. TPU kommt auf den externen Spulenhalter: im Druckdialog „Externe Spule“ wählen." },
  { en = "Build plate: Textured PEI. Wash it with dish soap and warm water, dry it, and do not touch the surface. Bed 80 °C for PETG, 45 °C for TPU (set by the profiles).", it = "Piatto: PEI testurizzato. Lavatelo con detersivo per piatti e acqua tiepida, asciugatelo e non toccate la superficie. Letto a 80 °C per il PETG, 45 °C per il TPU (impostati dai profili).", de = "Druckplatte: texturiertes PEI. Mit Spülmittel und warmem Wasser waschen, trocknen und die Fläche nicht anfassen. Bett 80 °C für PETG, 45 °C für TPU (von den Profilen gesetzt)." },
  { en = "Open a project in Bambu Studio and check the printer (Bambu Lab A1 0.4 nozzle), the plate type (Textured PEI Plate), the process (0.20mm Standard @BBL A1) and the filament colours in the right slots. Slice once and look at the preview before you send it.", it = "Aprite un progetto in Bambu Studio e controllate stampante (Bambu Lab A1 0.4 nozzle), tipo di piatto (Textured PEI Plate), processo (0.20mm Standard @BBL A1) e i colori dei filamenti negli slot giusti. Fate lo slicing una volta e guardate l'anteprima prima di inviare.", de = "Öffnet ein Projekt in Bambu Studio und prüft Drucker (Bambu Lab A1 0.4 nozzle), Plattentyp (Textured PEI Plate), Prozess (0.20mm Standard @BBL A1) und die Filamentfarben in den richtigen Slots. Einmal slicen und die Vorschau ansehen, bevor ihr druckt." },
  { en = "Keep “Bed levelling” and “Flow dynamics calibration” ticked in the print dialog.", it = "Lasciate spuntati “Livellamento del piatto” e “Calibrazione della dinamica del flusso” nella finestra di stampa.", de = "„Bettnivellierung“ und „Flussdynamik-Kalibrierung“ im Druckdialog angehakt lassen." },
  { en = "Tools for the work after printing: flush cutters, long-nose pliers, a deburring knife, drills 1.5, 2.0, 5.1 and 8.2 mm (turned by hand), a soldering iron with an M3 insert tip, a small vice or hammer, a steel rule and calipers.", it = "Attrezzi per il lavoro dopo la stampa: tronchesine, pinze a becchi lunghi, un raschietto sbavatore, punte da 1,5, 2,0, 5,1 e 8,2 mm (girate a mano), un saldatore con punta per inserti M3, una piccola morsa o un martello, una riga d'acciaio e un calibro.", de = "Werkzeug für die Nacharbeit: Seitenschneider, Spitzzange, Entgratmesser, Bohrer 1,5, 2,0, 5,1 und 8,2 mm (von Hand gedreht), ein Lötkolben mit M3-Einsatzspitze, ein kleiner Schraubstock oder Hammer, ein Stahllineal und ein Messschieber." },
]

