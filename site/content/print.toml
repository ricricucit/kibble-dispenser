[head]
kicker = { en = "Kibble Dispenser Outdoor · hardware 6.4", it = "Kibble Dispenser Outdoor · hardware 6.4", de = "Kibble Dispenser Outdoor · Hardware 6.4" }
title = { en = "Print guide", it = "Guida di stampa", de = "Druckanleitung" }
lead = { en = "Everything in order on a Bambu Lab A1 with the AMS lite: prepare, print the test coupons, then one plate per step with what to load, what to check in the slicer, what to look at on the parts and what to do with them before assembly.", it = "Tutto in ordine su una Bambu Lab A1 con AMS lite: preparate, stampate i provini, poi un piatto per passo, con cosa caricare, cosa controllare nello slicer, cosa guardare sui pezzi e cosa farne prima del montaggio.", de = "Alles der Reihe nach auf einem Bambu Lab A1 mit AMS lite: vorbereiten, Testproben drucken, dann eine Platte pro Schritt, mit dem, was geladen wird, was im Slicer zu prüfen ist, worauf man an den Teilen achtet und was vor der Montage zu tun ist." }
products = { en = "Hardware 6.4 is two products: the chassis 6.4 (the dispenser, with the servo bay and the holder) and the electronics module case 1.0 (a sealed case that slides in from below and has its own files and version).", it = "L'hardware 6.4 è fatto di due prodotti: il telaio 6.4 (il distributore, con il vano servo e il supporto) e il modulo elettronica case 1.0 (una scatola stagna che entra da sotto e ha i suoi file e la sua versione).", de = "Hardware 6.4 besteht aus zwei Produkten: dem Gehäuse 6.4 (der Spender, mit Servofach und Halter) und dem Elektronikmodul case 1.0 (ein dichtes Gehäuse, das von unten eingeschoben wird und eigene Dateien und eine eigene Version hat)." }

[banner]
title = { en = "Hardware 6.4: designed, not yet printed or tested", it = "Hardware 6.4: disegnato, non ancora stampato né provato", de = "Hardware 6.4: konstruiert, noch nicht gedruckt oder getestet" }
body = { en = "Every part is checked in CAD, an independent print review is done and its findings are fixed, and every plate slices without warnings. Nobody has printed 6.4 yet: start with the test coupons and tell us how they fit. Two parts need supports, both set up in the projects: tree supports under the three tabs of the shell, and two tiny columns under the button recess of the module tub.", it = "Ogni pezzo è verificato in CAD, una revisione di stampa indipendente è fatta e i suoi rilievi sono corretti, e ogni piatto passa lo slicing senza avvisi. Nessuno ha ancora stampato la 6.4: cominciate dai provini e diteci come vanno. Due pezzi chiedono supporti, già impostati nei progetti: supporti ad albero sotto le tre alette del guscio e due colonnine minuscole sotto l'incavo del pulsante della vasca del modulo.", de = "Jedes Teil ist im CAD geprüft, eine unabhängige Druckprüfung ist gemacht und ihre Punkte sind behoben, und jede Platte slict ohne Warnungen. Gedruckt hat 6.4 noch niemand: fangt mit den Testproben an und erzählt uns, wie sie passen. Zwei Teile brauchen Stützen, beide in den Projekten eingerichtet: Baumstützen unter den drei Laschen der Hülle und zwei winzige Säulen unter der Tastermulde der Modulwanne." }
review = { en = "Print review", it = "Revisione di stampa", de = "Druckprüfung" }

