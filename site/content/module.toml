[fit]
title = { en = "How it fits", it = "Come si monta", de = "Wie es sitzt" }
items = [
  { en = "It slides straight up into the opening of the shell and the cap ({travel} mm of travel). Two closed sockets in its back corners take the two posts of the servo bay; the post ends are the vertical stop.", it = "Sale dritto nell'apertura del guscio e del fondello ({travel} mm di corsa). Due sedi chiuse negli angoli posteriori accolgono le due colonnine del vano servo; le estremità delle colonnine fanno da arresto verticale.", de = "Es wird gerade nach oben in die Öffnung von Hülle und Boden geschoben ({travel} mm Weg). Zwei geschlossene Buchsen in den hinteren Ecken nehmen die zwei Säulen des Servofachs auf; die Säulenenden sind der Höhenanschlag." },
  { en = "Two M3 × 16 screws from below (hex 2.5, {torque}) lock it into the inserts of the posts. They stay with the module.", it = "Due viti M3 × 16 da sotto (esagono 2,5, {torque}) lo bloccano negli inserti delle colonnine. Restano con il modulo.", de = "Zwei M3 × 16-Schrauben von unten (Innensechskant 2,5, {torque}) sichern es in den Einsätzen der Säulen. Sie bleiben am Modul." },
  { en = "Its outer wall is part of the pod skin and carries the control panel: one recessed push-button, two light pipes, three knock-outs and the speaker grille facing down. Hang the dispenser with the panel facing you.", it = "La sua parete esterna fa parte del guscio e porta il pannello comandi: un pulsante incassato, due guide di luce, tre predisposizioni e la griglia dell'altoparlante rivolta verso il basso. Appendete il distributore con il pannello rivolto verso di voi.", de = "Seine Außenwand ist Teil der Hülle und trägt das Bedienfeld: ein versenkter Taster, zwei Lichtleiter, drei Ausbrüche und das nach unten zeigende Lautsprechergitter. Hängt den Spender mit dem Bedienfeld zu euch hin auf." },
  { en = "Service: take the two screws out and let the module down. At {lowered} mm its top is below the pod and the plug of J1 is free in the hand: unscrew the ring and put the module on the bench. The harness allows up to {max} mm.", it = "Manutenzione: togliete le due viti e lasciate scendere il modulo. A {lowered} mm la sua parte alta è sotto il guscio e la spina di J1 è libera in mano: svitate la ghiera e appoggiate il modulo sul banco. Il cablaggio permette fino a {max} mm.", de = "Wartung: die zwei Schrauben heraus und das Modul absenken. Bei {lowered} mm ist seine Oberseite unter der Hülle und der Stecker von J1 frei in der Hand: Ring abschrauben und das Modul auf den Tisch legen. Der Kabelbaum erlaubt bis zu {max} mm." },
  { en = "Sealing: the module is sealed on its own (target IP66): lid gasket, sealed panel parts, J1 and lid screws with O-rings. The seams to the chassis are open 0.35 mm gaps behind return ribs.", it = "Tenuta: il modulo è stagno da solo (obiettivo IP66): guarnizione del coperchio, pezzi del pannello a tenuta, J1 e viti del coperchio con O-ring. Le fessure verso il telaio sono aperte, 0,35 mm, dietro nervature di ritorno.", de = "Dichtung: das Modul ist für sich dicht (Ziel IP66): Deckeldichtung, abgedichtete Bedienfeldteile, J1 und Deckelschrauben mit O-Ringen. Die Fugen zum Spendergehäuse sind offene 0,35-mm-Spalte hinter Rücklaufrippen." },
]

