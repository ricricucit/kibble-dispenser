fits = [
  { en = "The green 5 × 7 cm double-sided perfboard of the bench prototype, standing in board slot A, with the ESP32-WROVER on socket strips (stack about 61 × 28 × 25 mm) and no extension board.", it = "La millefori verde doppia faccia 5 × 7 cm del prototipo da banco, in piedi nello slot A, con l'ESP32-WROVER su strip (ingombro circa 61 × 28 × 25 mm) e senza scheda di estensione.", de = "Die grüne doppelseitige Lochrasterplatine 5 × 7 cm des Bench-Prototyps, stehend in Platinenschlitz A, mit dem ESP32-WROVER auf Buchsenleisten (Aufbau etwa 61 × 28 × 25 mm) und ohne Erweiterungsplatine." },
  { en = "A second board in slot B only when the stack on the board in slot A is at most {gap} mm (for example a regulator board in A and the ESP32 board on low sockets in B, with {b0} to {b1} mm in front of B). The 6 V and 5 V regulators and the capacitor fit beside the ESP32 zone.", it = "Una seconda scheda nello slot B solo se l'ingombro sulla scheda dello slot A non supera {gap} mm (per esempio una scheda regolatori in A e la scheda ESP32 su zoccoli bassi in B, con {b0}–{b1} mm davanti a B). I regolatori 6 V e 5 V e il condensatore stanno accanto alla zona dell'ESP32.", de = "Eine zweite Platine in Schlitz B nur, wenn der Aufbau auf der Platine in Schlitz A höchstens {gap} mm hoch ist (zum Beispiel eine Reglerplatine in A und die ESP32-Platine auf niedrigen Sockeln in B, mit {b0} bis {b1} mm vor B). Die 6-V- und 5-V-Regler und der Kondensator passen neben die ESP32-Zone." },
  { en = "A speaker of Ø20 to Ø24 mm in a printed ring on the floor collar (the ring of case 1.0 is for Ø23), behind the grille and an IP67 acoustic membrane.", it = "Un altoparlante da Ø20 a Ø24 mm in un anello stampato sul collare del fondo (l'anello del case 1.0 è per Ø23), dietro la griglia e una membrana acustica IP67.", de = "Ein Lautsprecher Ø20 bis Ø24 mm in einem gedruckten Ring auf dem Bodenkragen (der Ring von case 1.0 ist für Ø23), hinter dem Gitter und einer IP67-Akustikmembran." },
  { en = "A blind USB-C position engraved on the lid, to drill for a sealed panel USB-C when needed.", it = "Una posizione cieca per USB-C incisa sul coperchio, da forare per una USB-C da pannello a tenuta quando serve.", de = "Eine blinde USB-C-Position auf dem Deckel graviert, bei Bedarf für eine dichte Einbau-USB-C zu bohren." },
]
