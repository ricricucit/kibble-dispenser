[j1]
title = { en = "Connector J1", it = "Connettore J1", de = "Stecker J1" }
lead = { en = "One plug carries everything between chassis and module: an M8 5-pin A-coded panel socket (female) in a turret on the module lid. Pinout as specified for case 1.0:", it = "Una sola spina porta tutto tra telaio e modulo: una presa M8 5 poli codifica A da pannello (femmina) in una torretta sul coperchio del modulo. Piedinatura come specificata per il case 1.0:", de = "Ein Stecker trägt alles zwischen Spendergehäuse und Modul: eine M8-Einbaubuchse 5-polig, A-kodiert (Buchse) in einem Turm auf dem Moduldeckel. Belegung wie für case 1.0 festgelegt:" }
pin = { en = "Pin", it = "Pin", de = "Pin" }
current = { en = "M8 5-pin contacts are rated about 3 A: enough for a standard servo (stall about 2.5 A at 6 V). A stronger servo would need the 4-pin 4 A version plus the PWM on a separate M8.", it = "I contatti M8 5 poli reggono circa 3 A: bastano per un servo standard (circa 2,5 A da bloccato a 6 V). Un servo più forte richiederebbe la versione 4 poli da 4 A più il PWM su un M8 separato.", de = "M8-Kontakte 5-polig sind für etwa 3 A ausgelegt: genug für einen Standardservo (blockiert etwa 2,5 A bei 6 V). Ein stärkerer Servo bräuchte die 4-polige 4-A-Version und das PWM auf einem eigenen M8." }
verify = { en = "Check the thread and nut of the socket you buy before printing the lid (an 8.2 mm hole and a nut up to 13 mm across flats are assumed).", it = "Controllate filetto e dado della presa che comprate prima di stampare il coperchio (si ipotizzano un foro da 8,2 mm e un dado fino a 13 mm).", de = "Prüft Gewinde und Mutter der gekauften Buchse vor dem Druck des Deckels (angenommen sind ein 8,2-mm-Loch und eine Mutter bis 13 mm SW)." }

