# Page of the electronics module case 1.0 (module/), in English, Italian and German. Rendered by site/modulepage.py.
# Dimensions, pins and harness lengths come from hardware/v6.4/cad/v64.json (interface, module); only the words are here.

[meta.title]
en = "Electronics module, case 1.0 · Kibble Dispenser"
it = "Modulo elettronica, case 1.0 · Kibble Dispenser"
de = "Elektronikmodul, case 1.0 · Kibble Dispenser"

[meta.description]
en = "The detachable electronics module of the Kibble Dispenser Outdoor hardware 6.4: a sealed case with its own version line (case 1.0), the fixed interface to the chassis, the connector pinout, the harness, the usable space inside and what fits. Designed, not yet printed or tested."

[head]
kicker = { en = "Kibble Dispenser Outdoor · electronics module", it = "Kibble Dispenser Outdoor · modulo elettronica", de = "Kibble Dispenser Outdoor · Elektronikmodul" }
title = { en = "The electronics module, case 1.0", it = "Il modulo elettronica, case 1.0", de = "Das Elektronikmodul, case 1.0" }
lead = { en = "From hardware 6.4 the electronics live in their own sealed case. It slides into the dispenser from below, its outer wall is the missing piece of the pod and carries the control panel, and it comes out with two screws and one plug, without opening the chassis. The servo stays in the chassis.", it = "Dall'hardware 6.4 l'elettronica sta in una sua scatola stagna. Entra nel distributore da sotto, la sua parete esterna è il pezzo mancante del guscio e porta il pannello comandi, ed esce con due viti e una spina, senza aprire il telaio. Il servo resta nel telaio.", de = "Ab Hardware 6.4 sitzt die Elektronik in einem eigenen dichten Gehäuse. Es wird von unten in den Spender geschoben, seine Außenwand ist das fehlende Stück der Hülle und trägt das Bedienfeld, und es kommt mit zwei Schrauben und einem Stecker heraus, ohne das Gehäuse des Spenders zu öffnen. Der Servo bleibt im Spender." }

[banner]
title = { en = "Case 1.0: designed, not yet printed or tested", it = "Case 1.0: disegnato, non ancora stampato né provato", de = "Case 1.0: konstruiert, noch nicht gedruckt oder getestet" }
body = { en = "The module has its own version line: case 1.0 is version 1.0.0, tag case-v1.0.0, and it fits hardware 6.4. The holder side of the interface is fixed from 6.4 on, so a new case can change the inside without touching the chassis. The firmware for the one-button panel is still to come (issue #2); a camera comes later (issue #3).", it = "Il modulo ha una sua linea di versioni: case 1.0 è la versione 1.0.0, tag case-v1.0.0, e si monta sull'hardware 6.4. Il lato del supporto dell'interfaccia è fisso dalla 6.4 in poi, quindi una scatola nuova può cambiare l'interno senza toccare il telaio. Il firmware per il pannello a un pulsante deve ancora arrivare (issue #2); una telecamera verrà più avanti (issue #3).", de = "Das Modul hat eine eigene Versionslinie: case 1.0 ist Version 1.0.0, Tag case-v1.0.0, und passt zu Hardware 6.4. Die Halterseite der Schnittstelle ist ab 6.4 fest, ein neues Gehäuse kann also das Innere ändern, ohne das Spendergehäuse anzufassen. Die Firmware für das Ein-Tasten-Bedienfeld kommt noch (Issue #2); eine Kamera kommt später (Issue #3)." }

