[harness]
title = { en = "The chassis harness", it = "Il cablaggio del telaio", de = "Der Kabelbaum des Spendergehäuses" }
lead = { en = "A short harness in the chassis joins the supply, the servo and the module. The servo and its own lead stay untouched and replaceable.", it = "Un breve cablaggio nel telaio unisce alimentazione, servo e modulo. Il servo e il suo cavetto restano intatti e sostituibili.", de = "Ein kurzer Kabelbaum im Spendergehäuse verbindet Versorgung, Servo und Modul. Der Servo und sein eigenes Kabel bleiben unberührt und austauschbar." }
tail = { en = "Tail to J1: an angled M8 5-pin male cordset, PUR Ø4.5, cut to {tail} mm; parked as a service loop on the module lid ({parked} mm of path). It lets the module down up to {max} mm; {lowered} mm needs {need} mm.", it = "Coda verso J1: un cavo M8 5 poli maschio a 90°, PUR Ø4,5, tagliato a {tail} mm; riposa in un'asola di servizio sul coperchio del modulo ({parked} mm di percorso). Lascia scendere il modulo fino a {max} mm; {lowered} mm ne chiedono {need}.", de = "Ende zu J1: ein gewinkelter M8-Kabelstecker 5-polig, PUR Ø4,5, auf {tail} mm gekürzt; als Serviceschlaufe auf dem Moduldeckel abgelegt ({parked} mm Weg). Er lässt das Modul bis {max} mm herunter; {lowered} mm brauchen {need} mm." }
v12 = { en = "12 V branch: {len} mm of 2-core PUR to the M8 IP67 connector in the pod top (unchanged from 6.3).", it = "Ramo 12 V: {len} mm di cavo PUR a 2 poli fino al connettore M8 IP67 in cima al guscio (come nella 6.3).", de = "12-V-Zweig: {len} mm 2-adriges PUR zum M8-IP67-Stecker oben in der Hülle (wie 6.3)." }
servo = { en = "Servo branch: {len} mm of round PUR 3 × 0.25 mm² through the M12 gland into the servo bay, ending in a crimped JR 3-pin female; the servo plugs into it.", it = "Ramo servo: {len} mm di cavo tondo PUR 3 × 0,25 mm² attraverso il pressacavo M12 nel vano servo, con un connettore JR 3 poli femmina crimpato in fondo; il servo ci si innesta.", de = "Servozweig: {len} mm rundes PUR 3 × 0,25 mm² durch die M12-Verschraubung ins Servofach, mit gecrimpter JR-Buchse 3-polig am Ende; der Servo steckt darin." }
splice = { en = "Y splice: soldered, under adhesive-lined heat shrink Ø8 × 20. Tail pin 1 → 12 V +, 3 → GND of both, 2 → servo signal, 4 → servo +6 V, 5 not connected.", it = "Giunzione a Y: saldata, sotto guaina termorestringente con adesivo Ø8 × 20. Pin della coda 1 → 12 V +, 3 → GND di entrambi, 2 → segnale servo, 4 → servo +6 V, 5 non collegato.", de = "Y-Spleiß: gelötet, unter Schrumpfschlauch mit Kleber Ø8 × 20. Pin des Endes 1 → 12 V +, 3 → GND beider, 2 → Servosignal, 4 → Servo +6 V, 5 nicht belegt." }

