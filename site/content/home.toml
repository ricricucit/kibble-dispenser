# ------------------------------------------------------------------ status
[status.title]
en = "Where the project stands"
it = "A che punto è il progetto"
de = "Wo das Projekt steht"

[status.stamp]
en = "v6.3: designed, not yet printed or tested"
it = "v6.3: disegnata, non ancora stampata né provata"
de = "v6.3: konstruiert, noch nicht gedruckt oder getestet"

[status.v6]
title = { en = "Design v6.3, in CAD", it = "Progetto v6.3, in CAD", de = "Entwurf v6.3, im CAD" }
body = { en = "Every part is generated by Python scripts and checked automatically: closed meshes, no interference in 1596 pairs of parts, the gate stroke and its interlock, a straight key or driver reaching every screw, seals in contact all round, a dry pocket behind the control panel, paw and fingertip probes, no line of sight into the pod. The print orientations and the dowel hole are now in the CAD. Nothing of v6.3 has been printed yet.", it = "Ogni pezzo è generato da script Python e verificato in automatico: mesh chiuse, nessuna interferenza in 1596 coppie di pezzi, la corsa della saracinesca e il suo interblocco, una chiave o un cacciavite dritto che arriva a ogni vite, guarnizioni a contatto tutto intorno, una tasca asciutta dietro il pannello comandi, prove con zampa e polpastrello, nessuna linea di vista dentro il guscio. Gli orientamenti di stampa e il foro della spina ora sono nel CAD. Della v6.3 non è ancora stato stampato nulla.", de = "Jedes Teil wird von Python-Skripten erzeugt und automatisch geprüft: geschlossene Netze, keine Überschneidung in 1596 Teilepaaren, der Schieberweg und seine Verriegelung, ein gerader Schlüssel oder Schraubendreher erreicht jede Schraube, Dichtungen rundum in Kontakt, eine trockene Tasche hinter dem Bedienfeld, Pfoten- und Fingerkuppenproben, keine Sichtlinie in die Hülle. Druckausrichtungen und Stiftloch sind jetzt im CAD. Von v6.3 ist noch nichts gedruckt." }

[status.bench]
title = { en = "The prototype on the bench", it = "Il prototipo sul banco", de = "Der Prototyp auf der Werkbank" }
body = { en = "The electronics and the firmware already work on the bench: a Freenove ESP32-WROVER board running MicroPython, with two buttons (on/off and dispense), an LED and a sound with every portion. Hardware 6.3 has one button and two LEDs instead, so it needs new firmware: single press for a portion, double press for on/off, long presses to reset, and never a portion at power-on (the last rest position is stored). That work is open in issue #2; until then the bench keeps its two buttons.", it = "Elettronica e firmware funzionano già sul banco: una scheda Freenove ESP32-WROVER con MicroPython, due pulsanti (accensione ed erogazione), un LED e un suono a ogni porzione. L'hardware 6.3 ha invece un solo pulsante e due LED, quindi gli serve un firmware nuovo: pressione singola per una porzione, doppia per acceso/spento, lunga per azzerare, e mai una porzione quando arriva la corrente (si salva l'ultima posizione di riposo). Il lavoro è aperto nella issue #2; fino ad allora il banco tiene i suoi due pulsanti.", de = "Elektronik und Firmware laufen auf der Werkbank schon: ein Freenove-ESP32-WROVER-Board mit MicroPython, zwei Tasten (Ein/Aus und Ausgabe), eine LED und ein Ton bei jeder Portion. Hardware 6.3 hat stattdessen einen Taster und zwei LEDs und braucht deshalb neue Firmware: einfacher Druck für eine Portion, Doppeldruck für Ein/Aus, lange Drücke zum Zurücksetzen und nie eine Portion beim Einschalten der Versorgung (die letzte Ruheposition wird gespeichert). Die Arbeit ist in Issue #2 offen; bis dahin behält die Werkbank ihre zwei Tasten." }
firmware = { en = "Firmware source", it = "Sorgente del firmware", de = "Firmware-Quellcode" }
issue = { en = "Issue #2: one-button firmware", it = "Issue #2: firmware a un pulsante", de = "Issue #2: Ein-Knopf-Firmware" }

[status.photos]
overview = { en = "The bench prototype: ESP32-WROVER on a breadboard, speaker and 25 kg servo", it = "Il prototipo sul banco: ESP32-WROVER su breadboard, altoparlante e servo da 25 kg", de = "Der Prototyp auf der Werkbank: ESP32-WROVER auf dem Steckbrett, Lautsprecher und 25-kg-Servo" }
buttons = { en = "The two buttons, the speaker and the servo lead on the breadboard", it = "I due pulsanti, l'altoparlante e il cavo del servo sulla breadboard", de = "Die zwei Tasten, der Lautsprecher und das Servokabel auf dem Steckbrett" }
disc = { en = "An early printed disc in the bowl of prototype 1", it = "Un primo disco stampato nella vasca del prototipo 1", de = "Eine frühe gedruckte Scheibe in der Schale von Prototyp 1" }

[status.roadmap]
title = { en = "Roadmap", it = "Prossimi passi", de = "Fahrplan" }
