buttons = { en = "The two buttons, the speaker and the servo lead on the breadboard", it = "I due pulsanti, l'altoparlante e il cavo del servo sulla breadboard", de = "Die zwei Tasten, der Lautsprecher und das Servokabel auf dem Steckbrett" }
disc = { en = "An early printed disc in the bowl of prototype 1", it = "Un primo disco stampato nella vasca del prototipo 1", de = "Eine frühe gedruckte Scheibe in der Schale von Prototyp 1" }

