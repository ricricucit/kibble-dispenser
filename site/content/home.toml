it = "Il manuale d'uso del Kibble Dispenser Outdoor {v}: installazione, uso e manutenzione, in italiano, inglese e tedesco. Ogni lingua c'è come piccolo libretto A6 da leggere a schermo o stampare, e come versione A4 impaginata per la stampa a casa."
