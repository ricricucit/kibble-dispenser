[status.v6]
title = { en = "Design v6, in CAD", it = "Progetto v6, in CAD", de = "Entwurf v6, im CAD" }
body = { en = "Every part is generated by Python scripts and checked automatically: closed meshes, no interference in 575 pairs of parts, slopes of at least 50° for the food, the bayonet sweep, clearances and room for the hex key. Nothing of v6 has been printed yet.", it = "Ogni pezzo è generato da script Python e verificato in automatico: mesh chiuse, nessuna interferenza in 575 coppie di pezzi, pendenze di almeno 50° per il cibo, il movimento della baionetta, giochi e spazio per la chiave a brugola. Della v6 non è ancora stato stampato nulla.", de = "Jedes Teil wird von Python-Skripten erzeugt und automatisch geprüft: geschlossene Netze, keine Überschneidung in 575 Teilepaaren, mindestens 50° Gefälle für das Futter, der Weg des Bajonetts, Spiel und Platz für den Inbusschlüssel. Von v6 ist noch nichts gedruckt." }

[status.bench]
title = { en = "The prototype on the bench", it = "Il prototipo sul banco", de = "Der Prototyp auf der Werkbank" }
body = { en = "The electronics and the firmware already work: a Freenove ESP32-WROVER board running MicroPython, with an on/off button and LED, one portion when you switch it on and one per press, and a sound with every portion. It still drives an earlier mechanism, not v6.", it = "Elettronica e firmware funzionano già: una scheda Freenove ESP32-WROVER con MicroPython, pulsante di accensione con LED, una porzione all'accensione e una a ogni pressione, e un suono a ogni porzione. Muove ancora una meccanica precedente, non la v6.", de = "Elektronik und Firmware laufen schon: ein Freenove-ESP32-WROVER-Board mit MicroPython, Ein/Aus-Taste mit LED, eine Portion beim Einschalten und eine pro Tastendruck, und ein Ton bei jeder Portion. Es treibt noch eine frühere Mechanik an, nicht v6." }
firmware = { en = "Firmware source", it = "Sorgente del firmware", de = "Firmware-Quellcode" }

[status.photos]
