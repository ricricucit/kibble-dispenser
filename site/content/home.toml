  { en = "Firmware for the one-button panel and the stored rest position (issue #2)", it = "Firmware per il pannello a un pulsante e la posizione di riposo salvata (issue #2)", de = "Firmware für das Ein-Knopf-Bedienfeld und die gespeicherte Ruheposition (Issue #2)" },
