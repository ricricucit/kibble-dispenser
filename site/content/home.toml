# ------------------------------------------------------------------ status
[status.title]
en = "Where the project stands"
it = "A che punto è il progetto"
de = "Wo das Projekt steht"

[status.stamp]
en = "Hardware 6.4: designed, not yet printed or tested"
it = "Hardware 6.4: disegnato, non ancora stampato né provato"
de = "Hardware 6.4: konstruiert, noch nicht gedruckt oder getestet"

[status.v6]
title = { en = "Hardware 6.4, in CAD", it = "Hardware 6.4, in CAD", de = "Hardware 6.4, im CAD" }
body = { en = "Every part is generated by Python scripts and checked automatically: closed meshes, no interference in 1457 pairs of parts, the module sliding out freely, the servo bay and the module each sealed on its own, a straight key reaching every screw, paw and fingertip probes on the panel. An independent print review found 3 major and 19 minor points, now answered in the CAD. Nothing of 6.4 has been printed yet.", it = "Ogni pezzo è generato da script Python e verificato in automatico: mesh chiuse, nessuna interferenza in 1457 coppie di pezzi, il modulo che esce libero, vano servo e modulo stagni ciascuno per conto suo, una chiave dritta che arriva a ogni vite, prove con zampa e polpastrello sul pannello. Una revisione di stampa indipendente ha trovato 3 punti importanti e 19 minori, ora risolti nel CAD. Della 6.4 non è ancora stato stampato nulla.", de = "Jedes Teil wird von Python-Skripten erzeugt und automatisch geprüft: geschlossene Netze, keine Überschneidung in 1457 Teilepaaren, das Modul läuft frei heraus, Servofach und Modul sind jeweils für sich dicht, ein gerader Schlüssel erreicht jede Schraube, Pfoten- und Fingerkuppenproben am Bedienfeld. Eine unabhängige Druckprüfung fand 3 wichtige und 19 kleine Punkte, jetzt im CAD beantwortet. Von 6.4 ist noch nichts gedruckt." }

[status.bench]
title = { en = "The prototype on the bench", it = "Il prototipo sul banco", de = "Der Prototyp auf der Werkbank" }
body = { en = "The electronics and the firmware already work on the bench: a Freenove ESP32-WROVER board running MicroPython, with two buttons (on/off and dispense), an LED and a sound with every portion. The soldered prototype goes on a 5 × 7 cm board that fits the module. Hardware 6.4 has one button and two LEDs, so it needs new firmware: single press for a portion, double press for on/off, long presses to reset, and never a portion at power-on. That work is open in issue #2; until then the bench keeps its two buttons. A camera comes later (issue #3).", it = "Elettronica e firmware funzionano già sul banco: una scheda Freenove ESP32-WROVER con MicroPython, due pulsanti (accensione ed erogazione), un LED e un suono a ogni porzione. Il prototipo saldato va su una scheda 5 × 7 cm che entra nel modulo. L'hardware 6.4 ha un solo pulsante e due LED, quindi gli serve un firmware nuovo: pressione singola per una porzione, doppia per acceso/spento, lunga per azzerare, e mai una porzione quando arriva la corrente. Il lavoro è aperto nella issue #2; fino ad allora il banco tiene i suoi due pulsanti. Una telecamera verrà più avanti (issue #3).", de = "Elektronik und Firmware laufen auf der Werkbank schon: ein Freenove-ESP32-WROVER-Board mit MicroPython, zwei Tasten (Ein/Aus und Ausgabe), eine LED und ein Ton bei jeder Portion. Der gelötete Prototyp kommt auf eine 5 × 7-cm-Platine, die ins Modul passt. Hardware 6.4 hat einen Taster und zwei LEDs und braucht deshalb neue Firmware: einfacher Druck für eine Portion, Doppeldruck für Ein/Aus, lange Drücke zum Zurücksetzen und nie eine Portion beim Einschalten. Die Arbeit ist in Issue #2 offen; bis dahin behält die Werkbank ihre zwei Tasten. Eine Kamera kommt später (Issue #3)." }
firmware = { en = "Firmware source", it = "Sorgente del firmware", de = "Firmware-Quellcode" }
issue = { en = "Issue #2: one-button firmware", it = "Issue #2: firmware a un pulsante", de = "Issue #2: Ein-Knopf-Firmware" }

[status.photos]
overview = { en = "The bench prototype: ESP32-WROVER on a breadboard, speaker and 25 kg servo", it = "Il prototipo sul banco: ESP32-WROVER su breadboard, altoparlante e servo da 25 kg", de = "Der Prototyp auf der Werkbank: ESP32-WROVER auf dem Steckbrett, Lautsprecher und 25-kg-Servo" }
buttons = { en = "The two buttons, the speaker and the servo lead on the breadboard", it = "I due pulsanti, l'altoparlante e il cavo del servo sulla breadboard", de = "Die zwei Tasten, der Lautsprecher und das Servokabel auf dem Steckbrett" }
disc = { en = "An early printed disc in the bowl of prototype 1", it = "Un primo disco stampato nella vasca del prototipo 1", de = "Eine frühe gedruckte Scheibe in der Schale von Prototyp 1" }

[status.roadmap]
title = { en = "Roadmap", it = "Prossimi passi", de = "Fahrplan" }
now = { en = "now", it = "ora", de = "jetzt" }
items = [
  { en = "Print the test coupons, then hardware 6.4; assemble it with the guide and hose-test the servo bay and the module", it = "Stampare i provini, poi l'hardware 6.4; montarlo con la guida e provare con la canna vano servo e modulo", de = "Testproben drucken, dann Hardware 6.4; mit der Anleitung montieren und Servofach und Modul mit dem Schlauch testen" },
  { en = "Firmware for the one-button panel and the stored rest position (issue #2)", it = "Firmware per il pannello a un pulsante e la posizione di riposo salvata (issue #2)", de = "Firmware für das Ein-Knopf-Bedienfeld und die gespeicherte Ruheposition (Issue #2)" },
  { en = "Weigh real portions and calibrate the disc zero", it = "Pesare porzioni vere e tarare lo zero del disco", de = "Echte Portionen wiegen und den Nullpunkt der Scheibe einstellen" },
  { en = "Solder the bench electronics onto the 5 × 7 cm board and fit it into the module", it = "Saldare l'elettronica del banco sulla scheda 5 × 7 cm e montarla nel modulo", de = "Die Elektronik der Werkbank auf die 5 × 7-cm-Platine löten und ins Modul setzen" },
  { en = "A kit: pre-assembled chassis, the electronics module and the flange set", it = "Un kit: telaio già montato, modulo elettronica e set flangia", de = "Ein Bausatz: vormontiertes Gehäuse, Elektronikmodul und Flanschsatz" },
]

