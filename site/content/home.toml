# ------------------------------------------------------------------ idea
[idea.title]
en = "The idea"
it = "L'idea"
de = "Die Idee"

[idea.lead]
en = "An outdoor kibble dispenser for cats and dogs that carries no weight. The container stands on a shelf or a table, up to a 200 litre drum. The dispenser hangs underneath, and the kibble reaches it through one Ø76 mm hole."
it = "Un distributore di crocchette per l'esterno, per gatti e cani, che non porta pesi. Il contenitore sta su un ripiano o un tavolo, fino a un fusto da 200 litri. Il distributore è appeso sotto, e le crocchette gli arrivano da un solo foro Ø76 mm."
de = "Ein Futterspender für draußen, für Katzen und Hunde, der kein Gewicht trägt. Der Behälter steht auf einem Regalbrett oder Tisch, bis hin zu einem 200-Liter-Fass. Der Spender hängt darunter, und das Futter kommt durch ein einziges Loch mit Ø76 mm."

[[idea.points]]
[idea.points.title]
en = "The weight goes into the shelf"
it = "Il peso va sul ripiano"
de = "Das Gewicht trägt das Brett"
[idea.points.body]
en = "The container rests on the wood. Its weight never goes through the dispenser, so a small printed part can sit under a big supply."
it = "Il contenitore appoggia sul legno. Il suo peso non passa mai dal distributore, così un pezzo stampato piccolo può stare sotto una grande scorta."
de = "Der Behälter steht auf dem Holz. Sein Gewicht geht nie durch den Spender, deshalb kann ein kleines Druckteil unter einem großen Vorrat hängen."

[[idea.points]]
[idea.points.title]
en = "Weather from above, animals from below"
it = "Intemperie da sopra, animali da sotto"
de = "Wetter von oben, Tiere von unten"
[idea.points.body]
en = "The shelf is the roof. Everything electrical sits in a sealed box under it, and every opening faces down."
it = "Il ripiano fa da tetto. Tutta la parte elettrica sta in una scatola stagna sotto, e ogni apertura guarda in basso."
de = "Das Brett ist das Dach. Alles Elektrische sitzt in einem dichten Gehäuse darunter, und jede Öffnung zeigt nach unten."

[[idea.points]]
[idea.points.title]
en = "Built with a home printer"
it = "Si fa con una stampante di casa"
de = "Mit einem Drucker von zu Hause"
[idea.points.body]
en = "Every part fits a 256 mm bed. The rest is screws, O-rings and a small electronics module."
it = "Ogni pezzo sta su un piano da 256 mm. Il resto sono viti, O-ring e un piccolo modulo elettronico."
de = "Jedes Teil passt auf ein 256-mm-Druckbett. Der Rest sind Schrauben, O-Ringe und ein kleines Elektronikmodul."

