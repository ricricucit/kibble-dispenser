# ------------------------------------------------------------------ how it works
[how.title]
en = "How it works"
it = "Come funziona"
de = "So funktioniert's"

[how.lead]
en = "One moving part touches the food. Follow the green line: it is the path of the kibble, printed in green on the real parts too. Orange is where you act."
it = "Un solo pezzo in movimento tocca il cibo. Seguite la linea verde: è il percorso delle crocchette, stampato in verde anche sui pezzi veri. L'arancione è dove si agisce."
de = "Nur ein bewegtes Teil berührt das Futter. Folgt der grünen Linie: Sie ist der Weg des Futters, auch auf den echten Teilen grün gedruckt. Orange ist, wo man handelt."

[[how.steps]]
key = "disc"
[how.steps.title]
en = "A disc with two pockets"
it = "Un disco a due tasche"
de = "Eine Scheibe mit zwei Taschen"
[how.steps.body]
en = "Each half-turn fills one pocket from above and empties the other into the chute: about 6.5 g per portion (5.4 to 7.4 g, depending on the kibble). At rest there is no straight path from outside to the container, so the disc is also a rotary airlock against insects, mice and damp."
it = "A ogni mezzo giro una tasca si riempie da sopra e l'altra si svuota nello scivolo: circa 6,5 g a porzione (da 5,4 a 7,4 g, secondo le crocchette). A riposo non c'è una via diretta dall'esterno al contenitore, quindi il disco fa anche da chiusa rotante contro insetti, topi e umidità."
de = "Bei jeder halben Drehung füllt sich eine Tasche von oben, die andere leert sich in die Rutsche: etwa 6,5 g pro Portion (5,4 bis 7,4 g, je nach Futter). In Ruhe gibt es keinen direkten Weg von außen zum Behälter, die Scheibe ist also auch eine Zellenradschleuse gegen Insekten, Mäuse und Feuchtigkeit."

[[how.steps]]
key = "drive"
[how.steps.title]
en = "A servo right under the disc, no gears"
it = "Un servo proprio sotto il disco, senza ingranaggi"
de = "Ein Servo direkt unter der Scheibe, ohne Getriebe"
[how.steps.body]
en = "Servo, hub, shaft and disc share one axis. The shaft passes into the dry servo bay through two O-rings; the disc simply sits on its hex, with no screw. The servo stays in the chassis, so the electronics can come out without touching the drive."
it = "Servo, mozzo, albero e disco stanno su un solo asse. L'albero entra nel vano servo asciutto attraverso due O-ring; il disco si appoggia sul suo esagono, senza viti. Il servo resta nel telaio, così l'elettronica si toglie senza toccare la trasmissione."
de = "Servo, Nabe, Welle und Scheibe liegen auf einer Achse. Die Welle geht durch zwei O-Ringe in das trockene Servofach; die Scheibe sitzt einfach auf ihrem Sechskant, ohne Schraube. Der Servo bleibt im Gehäuse, so kommt die Elektronik heraus, ohne den Antrieb anzufassen."

[[how.steps]]
key = "gate"
[how.steps.title]
en = "A shut-off gate with an interlock"
it = "Una saracinesca con interblocco"
de = "Ein Absperrschieber mit Verriegelung"
[how.steps.body]
en = "The orange ring round the top of the pod turns a green blade inside the flange: a 113° turn closes the opening under the container. Only in that closed position does the window in the ring uncover the release button, so the unit cannot come down while food can fall out. No springs."
it = "L'anello arancione in cima al guscio fa girare una lama verde dentro la flangia: con 113° di rotazione chiude l'apertura sotto il contenitore. Solo in quella posizione chiusa la finestra dell'anello scopre il pulsante di sgancio, così l'unità non si può togliere mentre il cibo può cadere. Senza molle."
de = "Der orange Ring oben an der Hülle dreht ein grünes Blatt im Flansch: 113° Drehung schließen die Öffnung unter dem Behälter. Nur in dieser geschlossenen Stellung gibt das Fenster im Ring den Entriegelungsknopf frei, so lässt sich die Einheit nicht abnehmen, solange Futter herausfallen kann. Ohne Federn."

[[how.steps]]
key = "twist"
[how.steps.title]
en = "The whole unit comes off with one twist"
it = "L'unità intera si stacca con una rotazione"
de = "Die ganze Einheit löst sich mit einer Drehung"
[how.steps.body]
en = "Close the gate, press the release button through the window, turn the unit 30° and lower it 8 cm, then unscrew the connector in the gap: disc, chute, drive and electronics come down together in their pod. Only the flange set stays on the shelf. For the electronics alone you don't even need that: the module comes out from below."
it = "Chiudete la saracinesca, premete il pulsante di sgancio attraverso la finestra, girate l'unità di 30° e abbassatela di 8 cm, poi svitate il connettore nella fessura: disco, scivolo, trasmissione ed elettronica vengono giù insieme nel loro guscio. Sul ripiano resta solo il set flangia. Per la sola elettronica non serve neanche questo: il modulo esce da sotto."
de = "Schieber schließen, Entriegelungsknopf durch das Fenster drücken, Einheit um 30° drehen und 8 cm absenken, dann den Steckverbinder im Spalt aufschrauben: Scheibe, Rutsche, Antrieb und Elektronik kommen in ihrer Hülle zusammen herunter. Nur der Flanschsatz bleibt am Brett. Für die Elektronik allein braucht es nicht einmal das: das Modul kommt nach unten heraus."

[[how.steps]]
key = "shell"
[how.steps.title]
en = "A closed, claw-proof pod with a hidden chute"
it = "Un guscio chiuso, a prova di unghie, con lo scivolo nascosto"
de = "Eine geschlossene, kratzfeste Hülle mit verborgener Rutsche"
[how.steps.body]
en = "A smooth shell and a flat cap held by screws from below: no edge to hook a claw or a tooth on. The chute runs inside and ends in the outlet in the flat bottom. Inside the pod, the servo bay and the module are each sealed on their own, with O-rings and lip seals at every joint. Sealing the IP65 way is a design approach, not a certification: the hose test is still to come."
it = "Un guscio liscio e un fondello piatto fissato da viti da sotto: nessuno spigolo dove agganciare un artiglio o un dente. Lo scivolo corre dentro e finisce nell'uscita del fondo piatto. Dentro il guscio, il vano servo e il modulo sono stagni ciascuno per conto suo, con O-ring e labbri di tenuta a ogni giunto. La tenuta pensata per IP65 è un criterio di progetto, non una certificazione: la prova con la canna deve ancora venire."
de = "Eine glatte Hülle und ein flacher Boden, von unten verschraubt: keine Kante, an der Krallen oder Zähne greifen. Die Rutsche läuft innen und endet im Auslass im flachen Boden. In der Hülle sind Servofach und Modul jeweils für sich dicht, mit O-Ringen und Lippendichtungen an jeder Fuge. Die Abdichtung nach IP65-Prinzip ist ein Konstruktionsprinzip, keine Zertifizierung: der Schlauchtest steht noch aus."

[[how.steps]]
key = "module"
[how.steps.title]
en = "A detachable electronics module with the panel"
it = "Un modulo elettronica estraibile, con il pannello"
de = "Ein abnehmbares Elektronikmodul mit dem Bedienfeld"
[how.steps.body]
en = "The electronics live in a sealed case that slides into the pod from below and locks with two screws; one M8 plug connects it. Its outer wall carries the control panel: one push-button in a paw-proof recess, two light pipes, a speaker grille facing down and three blind knock-outs. Hang the dispenser with the panel facing you. The module has its own version line (case 1.0), so the inside can change without reprinting the chassis. The firmware for the one-button panel is still to come (issue #2); a camera comes later (issue #3)."
it = "L'elettronica sta in una scatola stagna che entra nel guscio da sotto e si blocca con due viti; la collega una sola spina M8. La sua parete esterna porta il pannello comandi: un pulsante in un incavo a prova di zampa, due guide luce, la griglia dell'altoparlante rivolta in basso e tre predisposizioni chiuse. Appendete il distributore con il pannello rivolto verso di voi. Il modulo ha una sua linea di versioni (case 1.0), così l'interno può cambiare senza ristampare il telaio. Il firmware per il pannello a un pulsante deve ancora arrivare (issue #2); una telecamera verrà più avanti (issue #3)."
de = "Die Elektronik sitzt in einem dichten Gehäuse, das von unten in die Hülle geschoben und mit zwei Schrauben gesichert wird; ein einziger M8-Stecker verbindet es. Seine Außenwand trägt das Bedienfeld: ein Taster in einer pfotensicheren Mulde, zwei Lichtleiter, ein nach unten zeigendes Lautsprechergitter und drei geschlossene Ausbrüche. Hängt den Spender mit dem Bedienfeld zu euch hin auf. Das Modul hat eine eigene Versionslinie (case 1.0), das Innere kann sich also ändern, ohne das Gehäuse neu zu drucken. Die Firmware für das Ein-Knopf-Bedienfeld kommt noch (Issue #2); eine Kamera kommt später (Issue #3)."

[[how.steps]]
key = "cable"
[how.steps.title]
en = "The cable leaves at the back, held by a tie"
it = "Il cavo esce dietro, trattenuto da una fascetta"
de = "Das Kabel geht hinten raus, von einem Kabelbinder gehalten"

[how.steps.body]
en = "No second hole in the shelf: the 12 V cable leaves at the back of the flange through a curved tunnel, and you clip it along the shelf. A UV-stable cable tie cinched in a window of the flange takes any pull or bite, so nothing reaches the waterproof M8 connector inside the top of the pod."
it = "Nessun secondo foro nel ripiano: il cavo a 12 V esce dietro la flangia da un tunnel curvo, e lo fissate lungo il ripiano con delle clip. Una fascetta resistente ai raggi UV, stretta in una finestra della flangia, prende ogni strappo o morso, così niente arriva al connettore M8 stagno dentro la parte alta del guscio."
de = "Kein zweites Loch im Brett: das 12-V-Kabel verlässt den Flansch hinten durch einen gebogenen Tunnel, und ihr clipst es am Brett entlang. Ein UV-beständiger Kabelbinder in einem Fenster des Flanschs nimmt jeden Zug oder Biss auf, so erreicht nichts den wasserdichten M8-Steckverbinder oben in der Hülle."

[[how.steps]]
key = "care"
[how.steps.title]
en = "Almost no maintenance"
it = "Quasi nessuna manutenzione"
de = "Fast wartungsfrei"

[how.steps.body]
en = "No grease and no oil, ever: the drive is sealed and greased for life. No silica gel: the servo bay breathes through a membrane vent. Ribs under the disc sweep crumbs away at every turn. Clean the food path every few months and keep the drain holes clear."
it = "Mai grasso né olio: la trasmissione è sigillata e lubrificata a vita. Niente gel di silice: il vano servo respira attraverso una membrana. Nervature sotto il disco spazzano via le briciole a ogni giro. Pulite il percorso del cibo ogni pochi mesi e tenete liberi i fori di scarico."
de = "Nie Fett, nie Öl: der Antrieb ist abgedichtet und dauergeschmiert. Kein Silicagel: das Servofach atmet über eine Membran. Rippen unter der Scheibe fegen bei jeder Drehung Krümel weg. Den Futterweg alle paar Monate reinigen und die Ablauflöcher frei halten."

[how.cta_module]
en = "The electronics module"
it = "Il modulo elettronica"
de = "Das Elektronikmodul"

[how.img_section]
en = "Section through the dispenser: flange with the gate on top, bowl and disc, tower with the sealed shaft, the servo in its sealed bay, and the electronics module in the pod"
it = "Sezione del distributore: flangia con la saracinesca in alto, vasca e disco, torre con l'albero a tenuta, il servo nel suo vano stagno e il modulo elettronica nel guscio"
de = "Schnitt durch den Spender: Flansch mit Schieber oben, Schale und Scheibe, Turm mit abgedichteter Welle, der Servo in seinem dichten Fach und das Elektronikmodul in der Hülle"

[how.cap_section]
en = "Section of hardware 6.4: food above, the servo bay and the module below, inside a closed pod."
it = "Sezione dell'hardware 6.4: cibo sopra, vano servo e modulo sotto, dentro un guscio chiuso."
de = "Schnitt von Hardware 6.4: Futter oben, Servofach und Modul unten, in einer geschlossenen Hülle."

