it = "pagine"
de = "Seiten"

[manual.print_note]
en = "The A4 version puts 4 A6 pages on each side of an A4 sheet: print it double-sided at 100 % with “flip on short edge”, cut the stack once, fold and staple it into the booklet. The first sheet shows how."
it = "La versione A4 mette 4 pagine A6 su ogni lato di un foglio A4: stampatela fronte e retro al 100 % con “capovolgi sul lato corto”, tagliate la pila una volta, piegatela e pinzatela a libretto. Il primo foglio spiega come."
de = "Die A4-Version setzt 4 A6-Seiten auf jede Seite eines A4-Blatts: beidseitig mit 100 % und „an kurzer Kante spiegeln“ drucken, den Stapel einmal schneiden, falzen und zum Heft heften. Das erste Blatt zeigt, wie."

[manual.template_title]
en = "Drilling template"
it = "Dima di foratura"
de = "Bohrschablone"

[manual.template_body]
en = "One A4 sheet at 1:1 for the underside of the shelf: the Ø76 hole, the four screw points, the cable path and the outlet. Print at 100 % (no “fit to page”) and check the 50 mm scale bar before you drill."
it = "Un foglio A4 in scala 1:1 per il lato inferiore del ripiano: il foro Ø76, i quattro punti delle viti, il percorso del cavo e l'uscita. Stampate al 100 % (senza “adatta alla pagina”) e controllate la barra di scala da 50 mm prima di forare."
de = "Ein A4-Blatt im Maßstab 1:1 für die Unterseite des Bretts: das Loch Ø76, die vier Schraubpunkte, der Kabelweg und der Auslass. Mit 100 % drucken (ohne „an Seite anpassen“) und vor dem Bohren den 50-mm-Maßstab prüfen."

[manual.also]
en = "Prefer it step by step, with the 3D model? The assembly guide has the same steps."
it = "Preferite passo per passo, con il modello 3D? La guida al montaggio ha gli stessi passi."
de = "Lieber Schritt für Schritt mit dem 3D-Modell? Die Montageanleitung hat dieselben Schritte."

