[build.kit]
title = { en = "The kit, when it comes", it = "Il kit, quando arriverà", de = "Der Bausatz, wenn er kommt" }
body = { en = "The plan for a kit: the chassis pre-assembled and closed, the electronics module ready and tested, and the flange set ready-made. You drill one hole with the template, screw on the flange, hang the unit with the panel facing you, clip the cable and plug it in. No kit is sold yet.", it = "Il progetto del kit: il telaio già montato e chiuso, il modulo elettronica pronto e provato, e il set flangia pronto. Si fa un foro con la dima, si avvita la flangia, si appende l'unità con il pannello rivolto verso di sé, si fissa il cavo con le clip e la si collega. Nessun kit è ancora in vendita.", de = "Der Plan für einen Bausatz: das Gehäuse vormontiert und verschlossen, das Elektronikmodul fertig und geprüft, und der Flanschsatz fertig. Ein Loch mit der Schablone bohren, den Flansch anschrauben, die Einheit mit dem Bedienfeld zu euch hin einhängen, das Kabel clipsen und einstecken. Noch wird kein Bausatz verkauft." }
items = [
  { en = "Chassis, pre-assembled, with the servo", it = "Telaio, già montato, con il servo", de = "Gehäuse, vormontiert, mit Servo" },
  { en = "Electronics module case 1.0 with the control panel", it = "Modulo elettronica case 1.0 con il pannello comandi", de = "Elektronikmodul case 1.0 mit Bedienfeld" },
  { en = "Flange set with gate and ring", it = "Set flangia con saracinesca e anello", de = "Flanschsatz mit Schieber und Ring" },
  { en = "Collar, gasket, cable tie, wood screws, template", it = "Colletto, guarnizione, fascetta, viti, dima", de = "Kragen, Dichtung, Kabelbinder, Schrauben, Schablone" },
]

