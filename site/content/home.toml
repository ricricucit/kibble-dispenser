# ------------------------------------------------------------------ how it works
[how.title]
en = "How it works"
it = "Come funziona"
de = "So funktioniert's"

[how.lead]
en = "One moving part touches the food. Follow the green line: it is the path of the kibble, printed in green on the real parts too. Orange is where you act."
it = "Un solo pezzo in movimento tocca il cibo. Seguite la linea verde: è il percorso delle crocchette, stampato in verde anche sui pezzi veri. L'arancione è dove si agisce."
de = "Nur ein bewegtes Teil berührt das Futter. Folgt der grünen Linie: Sie ist der Weg des Futters, auch auf den echten Teilen grün gedruckt. Orange ist, wo man handelt."

[[how.steps]]
key = "disc"
[how.steps.title]
en = "A disc with two pockets"
it = "Un disco a due tasche"
de = "Eine Scheibe mit zwei Taschen"
[how.steps.body]
en = "Each half-turn fills one pocket from above and empties the other into the chute: about 6.5 g per portion (5.4 to 7.4 g, depending on the kibble). At rest there is no straight path from outside to the container, so the disc is also a rotary airlock against insects, mice and damp."
it = "A ogni mezzo giro una tasca si riempie da sopra e l'altra si svuota nello scivolo: circa 6,5 g a porzione (da 5,4 a 7,4 g, secondo le crocchette). A riposo non c'è una via diretta dall'esterno al contenitore, quindi il disco fa anche da chiusa rotante contro insetti, topi e umidità."
de = "Bei jeder halben Drehung füllt sich eine Tasche von oben, die andere leert sich in die Rutsche: etwa 6,5 g pro Portion (5,4 bis 7,4 g, je nach Futter). In Ruhe gibt es keinen direkten Weg von außen zum Behälter, die Scheibe ist also auch eine Zellenradschleuse gegen Insekten, Mäuse und Feuchtigkeit."

[[how.steps]]
key = "drive"
[how.steps.title]
en = "A servo right under the disc, no gears"
it = "Un servo proprio sotto il disco, senza ingranaggi"
de = "Ein Servo direkt unter der Scheibe, ohne Getriebe"
[how.steps.body]
en = "Servo, hub, shaft and disc share one axis. The shaft passes into the dry electronics box through two O-rings; the disc simply sits on its hex, with no screw."
it = "Servo, mozzo, albero e disco stanno su un solo asse. L'albero entra nella scatola elettronica asciutta attraverso due O-ring; il disco si appoggia sul suo esagono, senza viti."
de = "Servo, Nabe, Welle und Scheibe liegen auf einer Achse. Die Welle geht durch zwei O-Ringe in das trockene Elektronikgehäuse; die Scheibe sitzt einfach auf ihrem Sechskant, ohne Schraube."

[[how.steps]]
key = "gate"
[how.steps.title]
en = "A shut-off gate with an interlock"
it = "Una saracinesca con interblocco"
de = "Ein Absperrschieber mit Verriegelung"
[how.steps.body]
en = "The orange ring round the top of the pod turns a green blade inside the flange: a 113° turn closes the opening under the container. Only in that closed position does the window in the ring uncover the release button, so the unit cannot come down while food can fall out. No springs."
it = "L'anello arancione in cima al guscio fa girare una lama verde dentro la flangia: con 113° di rotazione chiude l'apertura sotto il contenitore. Solo in quella posizione chiusa la finestra dell'anello scopre il pulsante di sgancio, così l'unità non si può togliere mentre il cibo può cadere. Senza molle."
de = "Der orange Ring oben an der Hülle dreht ein grünes Blatt im Flansch: 113° Drehung schließen die Öffnung unter dem Behälter. Nur in dieser geschlossenen Stellung gibt das Fenster im Ring den Entriegelungsknopf frei, so lässt sich die Einheit nicht abnehmen, solange Futter herausfallen kann. Ohne Federn."

[[how.steps]]
key = "twist"
[how.steps.title]
en = "The whole unit comes off with one twist"
it = "L'unità intera si stacca con una rotazione"
de = "Die ganze Einheit löst sich mit einer Drehung"
[how.steps.body]
en = "Close the gate, press the release button through the window, turn the unit 30° and lower it 8 cm, then unscrew the connector in the gap: disc, chute, drive and electronics come down together in their pod. Only the flange set stays on the shelf."
it = "Chiudete la saracinesca, premete il pulsante di sgancio attraverso la finestra, girate l'unità di 30° e abbassatela di 8 cm, poi svitate il connettore nella fessura: disco, scivolo, trasmissione ed elettronica vengono giù insieme nel loro guscio. Sul ripiano resta solo il set flangia."
de = "Schieber schließen, Entriegelungsknopf durch das Fenster drücken, Einheit um 30° drehen und 8 cm absenken, dann den Steckverbinder im Spalt aufschrauben: Scheibe, Rutsche, Antrieb und Elektronik kommen in ihrer Hülle zusammen herunter. Nur der Flanschsatz bleibt am Brett."

[[how.steps]]
key = "shell"
[how.steps.title]
en = "A closed, claw-proof pod with a hidden chute"
it = "Un guscio chiuso, a prova di unghie, con lo scivolo nascosto"
de = "Eine geschlossene, kratzfeste Hülle mit verborgener Rutsche"
[how.steps.body]
en = "A smooth shell and a flat cap held by three screws from below: no edge to hook a claw or a tooth on. The chute runs inside and ends in the outlet in the flat bottom. The pod is a second barrier round the sealed electronics box, with O-rings at the seam, the button and every screw head. Sealing the IP65 way is a design approach, not a certification: the hose test is still to come."
it = "Un guscio liscio e un fondello piatto fissato da tre viti da sotto: nessuno spigolo dove agganciare un artiglio o un dente. Lo scivolo corre dentro e finisce nell'uscita del fondo piatto. Il guscio è una seconda barriera intorno alla scatola elettronica stagna, con O-ring nel giunto, nel pulsante e sotto ogni testa di vite. La tenuta pensata per IP65 è un criterio di progetto, non una certificazione: la prova con la canna deve ancora venire."
de = "Eine glatte Hülle und ein flacher Boden, von unten mit drei Schrauben gehalten: keine Kante, an der Krallen oder Zähne greifen. Die Rutsche läuft innen und endet im Auslass im flachen Boden. Die Hülle ist eine zweite Barriere um das dichte Elektronikgehäuse, mit O-Ringen an der Fuge, am Knopf und unter jedem Schraubenkopf. Die Abdichtung nach IP65-Prinzip ist ein Konstruktionsprinzip, keine Zertifizierung: der Schlauchtest steht noch aus."

[[how.steps]]
key = "panel"
[how.steps.title]
en = "One button, two lights and a voice"
it = "Un pulsante, due luci e una voce"
de = "Ein Knopf, zwei Lichter und eine Stimme"
[how.steps.body]
en = "On the room side of the cap: one IP67 push-button in a paw-proof recess, two light pipes for status and Wi-Fi, and a sealed speaker opening behind an acoustic membrane. One press gives a portion while the unit is on, a double press switches it on or off, a long press resets it. Three blind knock-outs wait for later. The firmware for this one-button panel is still to be written."
it = "Sul lato stanza del fondello: un pulsante IP67 in un incavo a prova di zampa, due guide luce per stato e Wi-Fi e un'apertura stagna per l'altoparlante dietro una membrana acustica. Una pressione dà una porzione quando l'unità è accesa, una doppia pressione la accende o la spegne, una pressione lunga la azzera. Tre predisposizioni chiuse aspettano usi futuri. Il firmware per questo pannello a un pulsante è ancora da scrivere."
de = "Auf der Raumseite des Bodens: ein IP67-Taster in einer pfotensicheren Mulde, zwei Lichtleiter für Status und WLAN und eine dichte Lautsprecheröffnung hinter einer Akustikmembran. Ein Druck gibt eine Portion, wenn die Einheit an ist, ein Doppeldruck schaltet sie ein oder aus, ein langer Druck setzt sie zurück. Drei geschlossene Ausbrüche warten auf später. Die Firmware für dieses Ein-Knopf-Bedienfeld muss noch geschrieben werden."

[[how.steps]]
key = "cable"
[how.steps.title]
en = "The cable leaves at the back, held by a tie"
it = "Il cavo esce dietro, trattenuto da una fascetta"
de = "Das Kabel geht hinten raus, von einem Kabelbinder gehalten"

[how.steps.body]
en = "No channel and no second hole in the shelf: the 12 V cable leaves at the back of the flange through a curved tunnel, and you clip it along the shelf. A UV-stable cable tie cinched in a window of the flange takes any pull or bite, so nothing reaches the waterproof M8 connector inside the top of the pod."
it = "Niente canalina e nessun secondo foro nel ripiano: il cavo a 12 V esce dietro la flangia da un tunnel curvo, e lo fissate lungo il ripiano con delle clip. Una fascetta resistente ai raggi UV, stretta in una finestra della flangia, prende ogni strappo o morso, così niente arriva al connettore M8 stagno dentro la parte alta del guscio."
de = "Kein Kanal und kein zweites Loch im Brett: das 12-V-Kabel verlässt den Flansch hinten durch einen gebogenen Tunnel, und ihr clipst es am Brett entlang. Ein UV-beständiger Kabelbinder in einem Fenster des Flanschs nimmt jeden Zug oder Biss auf, so erreicht nichts den wasserdichten M8-Steckverbinder oben in der Hülle."

[[how.steps]]
key = "care"
[how.steps.title]
en = "Fewer parts, almost no maintenance"
it = "Meno pezzi, quasi nessuna manutenzione"
de = "Weniger Teile, fast wartungsfrei"

[how.steps.body]
en = "28 printed pieces instead of 36, 7 heat-set inserts instead of 12. No grease and no oil, ever: the drive is sealed and greased for life. No silica gel: the box breathes through a membrane vent. Ribs under the disc sweep crumbs away at every turn. Clean the food path every few months and keep the drain holes clear."
it = "28 pezzi stampati invece di 36, 7 inserti a caldo invece di 12. Mai grasso né olio: la trasmissione è sigillata e lubrificata a vita. Niente gel di silice: la scatola respira attraverso una valvola a membrana. Nervature sotto il disco spazzano via le briciole a ogni giro. Pulite il percorso del cibo ogni pochi mesi e tenete liberi i fori di scarico."
de = "28 Druckteile statt 36, 7 Gewindeeinsätze statt 12. Nie Fett, nie Öl: der Antrieb ist abgedichtet und dauergeschmiert. Kein Silicagel: das Gehäuse atmet über eine Membranbelüftung. Rippen unter der Scheibe fegen bei jeder Drehung Krümel weg. Den Futterweg alle paar Monate reinigen und die Ablauflöcher frei halten."

[how.img_section]
en = "Section through the dispenser: flange with the gate on top, bowl and disc, tower with the sealed shaft, electronics box with the servo inside the closed pod, control panel in the cap"
it = "Sezione del distributore: flangia con la saracinesca in alto, vasca e disco, torre con l'albero a tenuta, scatola elettronica con il servo dentro il guscio chiuso, pannello comandi nel fondello"
de = "Schnitt durch den Spender: Flansch mit Schieber oben, Schale und Scheibe, Turm mit abgedichteter Welle, Elektronikgehäuse mit Servo in der geschlossenen Hülle, Bedienfeld im Boden"

[how.cap_section]
en = "Section of v6.3: food above, electronics below, sealed box inside a closed pod."
it = "Sezione della v6.3: cibo sopra, elettronica sotto, scatola stagna dentro un guscio chiuso."
de = "Schnitt von v6.3: Futter oben, Elektronik unten, dichtes Gehäuse in geschlossener Hülle."

