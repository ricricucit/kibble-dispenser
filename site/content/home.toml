[archive.lead]
en = "Hardware 6.0.0, designed and checked in CAD in November 2026 and never printed. Designs v6.2 and v6.3 replaced it: they close the unit in a claw-proof pod with a shut-off gate and a control panel. These pages stay online so that old links keep working."
it = "Hardware 6.0.0, disegnato e verificato in CAD a novembre 2026 e mai stampato. I progetti v6.2 e v6.3 l'hanno sostituito: chiudono l'unità in un guscio a prova di unghie con saracinesca e pannello comandi. Queste pagine restano online perché i vecchi link continuino a funzionare."
de = "Hardware 6.0.0, im November 2026 konstruiert und im CAD geprüft, nie gedruckt. Die Entwürfe v6.2 und v6.3 haben ihn ersetzt: sie schließen die Einheit in eine kratzfeste Hülle mit Absperrschieber und Bedienfeld. Diese Seiten bleiben online, damit alte Links funktionieren."

