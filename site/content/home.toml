[archive_v62.lead]
en = "Hardware 6.2.0, designed and checked in CAD in November 2026 and never printed. Design v6.3 replaced it: a control panel with one button and two LEDs in the cap, no cable channel, fewer parts, and the print corrections folded into the CAD. These pages stay online so that old links keep working."
it = "Hardware 6.2.0, disegnato e verificato in CAD a novembre 2026 e mai stampato. Il progetto v6.3 l'ha sostituito: un pannello comandi con un pulsante e due LED nel fondello, niente canalina, meno pezzi e le correzioni di stampa riportate nel CAD. Queste pagine restano online perché i vecchi link continuino a funzionare."
de = "Hardware 6.2.0, im November 2026 konstruiert und im CAD geprüft, nie gedruckt. Entwurf v6.3 hat ihn ersetzt: ein Bedienfeld mit einem Taster und zwei LEDs im Boden, kein Kabelkanal, weniger Teile und die Druckkorrekturen im CAD. Diese Seiten bleiben online, damit alte Links funktionieren."

