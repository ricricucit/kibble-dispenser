# ------------------------------------------------------------------ how it works
[how.title]
en = "How it works"
it = "Come funziona"
de = "So funktioniert's"

[how.lead]
en = "One moving part touches the food. Follow the green line: it is the path of the kibble, printed in green on the real parts too."
it = "Un solo pezzo in movimento tocca il cibo. Seguite la linea verde: è il percorso delle crocchette, stampato in verde anche sui pezzi veri."
de = "Nur ein bewegtes Teil berührt das Futter. Folgt der grünen Linie: Sie ist der Weg des Futters, auch auf den echten Teilen grün gedruckt."

[[how.steps]]
key = "disc"
[how.steps.title]
en = "A disc with two pockets"
it = "Un disco a due tasche"
de = "Eine Scheibe mit zwei Taschen"
[how.steps.body]
en = "Each half-turn fills one pocket from above and empties the other into the chute: about 6.5 g per portion (5.4 to 7.4 g, depending on the kibble). At rest there is no straight path from outside to the container, so the disc is also a rotary airlock against insects, mice and damp."
it = "A ogni mezzo giro una tasca si riempie da sopra e l'altra si svuota nello scivolo: circa 6,5 g a porzione (da 5,4 a 7,4 g, secondo le crocchette). A riposo non c'è una via diretta dall'esterno al contenitore, quindi il disco fa anche da chiusa rotante contro insetti, topi e umidità."
de = "Bei jeder halben Drehung füllt sich eine Tasche von oben, die andere leert sich in die Rutsche: etwa 6,5 g pro Portion (5,4 bis 7,4 g, je nach Futter). In Ruhe gibt es keinen direkten Weg von außen zum Behälter, die Scheibe ist also auch eine Zellenradschleuse gegen Insekten, Mäuse und Feuchtigkeit."

[[how.steps]]
key = "drive"
[how.steps.title]
en = "A servo right under the disc, no gears"
it = "Un servo proprio sotto il disco, senza ingranaggi"
de = "Ein Servo direkt unter der Scheibe, ohne Getriebe"
[how.steps.body]
en = "Servo, hub, shaft and disc share one axis. The shaft passes into the dry box through two O-rings; the disc simply sits on its hex, with no screw."
it = "Servo, mozzo, albero e disco stanno su un solo asse. L'albero entra nella scatola asciutta attraverso due O-ring; il disco si appoggia sul suo esagono, senza viti."
de = "Servo, Nabe, Welle und Scheibe liegen auf einer Achse. Die Welle geht durch zwei O-Ringe in das trockene Gehäuse; die Scheibe sitzt einfach auf ihrem Sechskant, ohne Schraube."

[[how.steps]]
key = "twist"
[how.steps.title]
en = "The whole unit comes off with one twist"
it = "L'unità intera si stacca con una rotazione"
de = "Die ganze Einheit löst sich mit einer Drehung"
[how.steps.body]
en = "Press the orange latch, turn 30° and lower: bowl, disc, chute, tower, box, servo and electronics come down together for inspection. Only the flange stays on the shelf, and only the 12 V plug comes along."
it = "Premete la linguetta arancione, girate di 30° e abbassate: vasca, disco, scivolo, torre, scatola, servo ed elettronica vengono giù insieme, pronti per l'ispezione. Sul ripiano resta solo la flangia, e si stacca solo la spina a 12 V."
de = "Orange Lasche drücken, 30° drehen, absenken: Schale, Scheibe, Rutsche, Turm, Gehäuse, Servo und Elektronik kommen zur Kontrolle zusammen herunter. Nur der Flansch bleibt am Brett, nur der 12-V-Stecker wird getrennt."

[[how.steps]]
key = "seal"
[how.steps.title]
en = "Sealed the IP65 way"
it = "Tenuta pensata per IP65"
de = "Abgedichtet nach IP65-Prinzip"
[how.steps.body]
en = "Wet parts and dry parts are kept apart: every joint between them has an O-ring or a printed TPU seal, there are no windows, the only cable entry is a gland, and every opening faces down. It is a design approach, not a certification: the box still has to pass a hose test."
it = "Le parti bagnate e quelle asciutte restano separate: ogni giunto tra loro ha un O-ring o una guarnizione stampata in TPU, non ci sono finestre, l'unico ingresso cavo è un pressacavo, e ogni apertura guarda in basso. È un criterio di progetto, non una certificazione: la scatola deve ancora superare la prova con la canna."
de = "Nasse und trockene Teile bleiben getrennt: jede Fuge dazwischen hat einen O-Ring oder eine gedruckte TPU-Dichtung, es gibt keine Fenster, der einzige Kabeleingang ist eine Verschraubung, und jede Öffnung zeigt nach unten. Das ist ein Konstruktionsprinzip, keine Zertifizierung: der Schlauchtest steht noch aus."

[[how.steps]]
key = "outlet"
[how.steps.title]
en = "An open outlet with a hood and a drip edge"
it = "Uscita aperta con cappuccio e gocciolatoio"
de = "Offener Auslass mit Haube und Tropfkante"
[how.steps.body]
en = "The chute falls at 55° and ends in a cut that faces straight down, under a 32 mm hood. A drip ring sheds rain before it reaches the outlet. Nothing can clog behind a flap, because there is no flap."
it = "Lo scivolo scende a 55° e finisce con un taglio rivolto verso il basso, sotto un cappuccio da 32 mm. Un anello gocciolatoio fa cadere la pioggia prima che arrivi all'uscita. Niente si incastra dietro uno sportello, perché lo sportello non c'è."
de = "Die Rutsche fällt mit 55° und endet in einem Schnitt, der senkrecht nach unten zeigt, unter einer 32-mm-Haube. Ein Tropfring lässt Regen vor dem Auslass abtropfen. Hinter einer Klappe kann nichts klemmen, denn es gibt keine."

[[how.steps]]
key = "pipe"
[how.steps.title]
en = "Optional: a DN50 pipe down to the bowl"
it = "Opzionale: un tubo DN50 fino alla ciotola"
de = "Optional: ein DN50-Rohr bis zum Napf"
[how.steps.body]
en = "A standard 50 mm drain pipe slides over the chute spigot and carries the kibble to a bowl on the ground. Longer than about half a metre, give it its own support."
it = "Un normale tubo di scarico da 50 mm si infila sul codolo dello scivolo e porta le crocchette a una ciotola a terra. Oltre circa mezzo metro va sostenuto a parte."
de = "Ein normales 50-mm-Abflussrohr wird auf den Rutschenstutzen geschoben und führt das Futter zu einem Napf am Boden. Ab etwa einem halben Meter braucht es eine eigene Halterung."

[how.img_section]
en = "Section through the dispenser: bowl and disc on top, tower with the sealed shaft, box with the servo below"
it = "Sezione del distributore: vasca e disco sopra, torre con l'albero a tenuta, scatola con il servo sotto"
de = "Schnitt durch den Spender: Schale und Scheibe oben, Turm mit abgedichteter Welle, Gehäuse mit Servo darunter"

[how.cap_section]
en = "Section: food above, electronics below, two O-rings in between."
it = "Sezione: cibo sopra, elettronica sotto, due O-ring in mezzo."
de = "Schnitt: Futter oben, Elektronik unten, zwei O-Ringe dazwischen."

