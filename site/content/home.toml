body = { en = "Stainless screws, a few heat-set inserts, NBR O-rings, a steel dowel, the harness with two M8 connectors, an IP67 push-button with two light pipes, an acoustic membrane and the electronics. Split into chassis and module. Plus a Ø76 hole saw for the shelf.", it = "Viti inox, pochi inserti a caldo, O-ring in NBR, una spina d'acciaio, il cablaggio con due connettori M8, un pulsante IP67 con due guide luce, una membrana acustica e l'elettronica. Divisi tra telaio e modulo. E una sega a tazza Ø76 per il ripiano.", de = "Edelstahlschrauben, wenige Gewindeeinsätze, NBR-O-Ringe, ein Stahlstift, der Kabelbaum mit zwei M8-Steckern, ein IP67-Taster mit zwei Lichtleitern, eine Akustikmembran und die Elektronik. Nach Gehäuse und Modul getrennt. Dazu eine Lochsäge Ø76 für das Brett." }
cta = { en = "The full list", it = "L'elenco completo", de = "Die ganze Liste" }
screws = { en = "screws", it = "viti", de = "Schrauben" }
inserts = { en = "inserts", it = "inserti", de = "Einsätze" }
