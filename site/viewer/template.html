<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<style>
  /* Full-screen 3D stage with floating chrome: top bar (title, mode switch, full-screen button), control panel
     (side panel on desktop, bottom sheet on phones), part info card, HTML labels.
     Generated by make_viewer.py; UI text in English, Italian and German (see I18N below). */
  :root{
    color-scheme:light;
    --bg:#e7eaef; --panel:rgba(255,255,255,.9); --panel2:#f1f3f7; --line:#dde1e8; --line2:#c6ccd6;
    --fg:#171a21; --muted:#596073; --faint:#8a90a0;
    --accent:#df5329; --accent-fg:#ffffff; --accent-soft:rgba(223,83,41,.12);
    --cyan:#167fa0; --focus:#167fa0;
    --print:#2c8a53; --print-bg:rgba(44,138,83,.11); --buy:#16799e; --buy-bg:rgba(22,121,158,.11);
    --glass:rgba(255,255,255,.84); --ring:rgba(0,0,0,.14);
    --stage-a:#f7f8fa; --stage-b:#d3d8e0; --grid-a:#aab2bf; --grid-b:#cdd2da;
    --shadow:0 10px 32px rgba(17,22,35,.16);
    --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --panel-w:340px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0e0f13; --panel:rgba(22,24,31,.9); --panel2:#1d2029; --line:#2a2e3a; --line2:#3a4050;
      --fg:#e7e9f0; --muted:#9aa0b4; --faint:#6b7186;
      --accent:#ff6a3d; --accent-fg:#140b06; --accent-soft:rgba(255,106,61,.14);
      --cyan:#5cc9e6; --focus:#5cc9e6;
      --print:#6fcf8e; --print-bg:rgba(111,207,142,.13); --buy:#5cc9e6; --buy-bg:rgba(92,201,230,.13);
      --glass:rgba(18,20,27,.82); --ring:rgba(255,255,255,.14);
      --stage-a:#1b1e27; --stage-b:#0a0b0e; --grid-a:#343b4d; --grid-b:#1d212b;
      --shadow:0 10px 32px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e0f13; --panel:rgba(22,24,31,.9); --panel2:#1d2029; --line:#2a2e3a; --line2:#3a4050;
    --fg:#e7e9f0; --muted:#9aa0b4; --faint:#6b7186;
    --accent:#ff6a3d; --accent-fg:#140b06; --accent-soft:rgba(255,106,61,.14);
    --cyan:#5cc9e6; --focus:#5cc9e6;
    --print:#6fcf8e; --print-bg:rgba(111,207,142,.13); --buy:#5cc9e6; --buy-bg:rgba(92,201,230,.13);
    --glass:rgba(18,20,27,.82); --ring:rgba(255,255,255,.14);
    --stage-a:#1b1e27; --stage-b:#0a0b0e; --grid-a:#343b4d; --grid-b:#1d212b;
    --shadow:0 10px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}

  #stage{position:fixed;inset:0;background:radial-gradient(120% 100% at 50% 0%,var(--stage-a) 0%,var(--stage-b) 100%);touch-action:none;user-select:none;-webkit-user-select:none}
  body.forest #stage{background:#cdd9d6}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lab{position:absolute;left:0;top:0;display:none;align-items:center;gap:6px;font-size:12px;white-space:nowrap;will-change:transform}
  .lab.flip{flex-direction:row-reverse}
  .lab .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px var(--ring)}
  .lab .txt{background:var(--glass);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--fg)}

  /* top bar */
  .top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:10px;
       padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none}
  .top>*{pointer-events:auto}
  .brand{min-width:0;flex:0 1 auto;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .brand h1{font-size:14.5px;font-weight:600;margin:0;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{font-size:12px;color:var(--muted);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mode{flex:0 0 auto;display:flex;gap:2px;padding:3px;background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .mode button{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
  .mode button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .fs-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 12px;background:var(--glass);border:1px solid var(--line);border-radius:12px;color:var(--fg);font-size:13px;font-weight:500;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .fs-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fs-btn .fs-exit{display:none}
  .fs-btn[aria-pressed="true"] .fs-enter{display:none}
  .fs-btn[aria-pressed="true"] .fs-exit{display:inline}
  .fs-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  /* CSS fallback when the Fullscreen API is missing (iPhone Safari): hide the chrome, keep only the 3D view */
  body.immersive .brand,body.immersive .mode,body.immersive .panel,body.immersive .fab,body.immersive .hint,body.immersive .info{display:none!important}
  body.immersive .top{left:auto;right:0}
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .links a{color:var(--fg);text-decoration:none;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:500}
  .links a:hover{border-color:var(--accent)}
  .links a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .ver{margin:10px 0 0;font-size:11.5px;line-height:1.45;color:var(--muted)}
  .ver a{color:var(--muted)}
  .ver a:hover{color:var(--fg)}

  /* control panel */
  .panel{position:fixed;z-index:6;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 16px;flex:0 0 auto}
  .sheet-toggle{flex:1 1 auto;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);padding:4px 0;font-size:14px;font-weight:600;text-align:left;cursor:default}
  .grip{display:none}
  .chev{display:none}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
  .body{padding:0 16px 14px;overflow:auto;flex:1 1 auto;overscroll-behavior:contain}
  .sec{padding:12px 0;border-top:1px solid var(--line)}
  .sec:first-child{border-top:0;padding-top:4px}
  .sec[hidden]{display:none}
  .sec h2{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
  .sec-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .sec-h .grow{flex:1}
  .sec>h2{margin-bottom:9px}
  .fader{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px}
  .fader label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
  .fader label b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line2) var(--p,0%))}
  input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line2) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8.5px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent)}
  input[type=range]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
  input[type=range]:disabled{opacity:.4;cursor:default}
  .row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .seg{display:inline-flex;gap:2px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
  .seg button{border:0;background:transparent;color:var(--muted);min-width:38px;padding:6px 10px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
  .seg button:focus-visible{outline:2px solid var(--focus)}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{-webkit-appearance:none;appearance:none;margin:0;width:38px;height:22px;border-radius:22px;background:var(--line2);position:relative;cursor:pointer;transition:background .18s;flex:0 0 auto}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .18s}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(16px)}
  .switch input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .switch input:disabled{opacity:.4}
  .toggles{display:flex;flex-wrap:wrap;gap:10px 18px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .btn{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:500}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
  .btn:focus-visible,.chip:focus-visible,.row:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font-size:12.5px;font-weight:500;cursor:pointer}
  .chip .dot{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ring)}
  .chip .n{color:var(--faint);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="false"]{opacity:.5}
  .chip[aria-pressed="false"] .lbl{text-decoration:line-through}
  .tot{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  .grp{margin-top:6px}
  .grp h3{font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 2px;display:flex;gap:6px}
  .grp h3 .n{color:var(--faint);font-weight:400}
  .row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;background:transparent;border:1px solid transparent;border-radius:9px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
  .row:hover{background:var(--panel2)}
  .row[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
  .row.off{opacity:.45}
  .sw{width:13px;height:13px;border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--ring)}
  .nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  .nm b{font-size:13.5px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
  .nm span{font-size:12px;color:var(--muted);line-height:1.3}
  .pill{flex:0 0 auto;font-size:11.5px;line-height:1.5;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .pill.print{color:var(--print);background:var(--print-bg)}
  .pill.buy{color:var(--buy);background:var(--buy-bg)}
  .note{font-size:12px;color:var(--faint);margin:6px 0 0;line-height:1.45}

  @media (min-width:761px){
    .top{right:calc(var(--panel-w) + 24px)}
    body.panel-closed .top{right:120px}
    .panel{top:12px;right:12px;bottom:12px;width:var(--panel-w);border-radius:16px;transition:transform .25s ease,opacity .25s ease}
    body.panel-closed .panel{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  }
  @media (max-width:760px){
    .top{gap:8px}
    .brand{flex:1 1 auto;padding:6px 10px}
    .brand h1{font-size:13.5px}
    .brand p{display:none}
    .mode button{padding:7px 10px;font-size:12.5px}
    .fs-btn{padding:7px 9px}
    .fs-btn .t{display:none}
    .panel{left:0;right:0;bottom:0;max-height:78dvh;max-height:78vh;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
    .head{padding:6px 12px 2px 16px}
    .sheet-toggle{cursor:pointer;flex-direction:column;align-items:stretch;gap:6px;padding:2px 0 4px}
    .sheet-toggle .lineh{display:flex;align-items:center;gap:8px}
    .grip{display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto}
    .chev{display:inline-block;margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
    body.sheet-open .chev{transform:rotate(135deg)}
    .icon-btn#panelClose{display:none}
    .body{max-height:var(--peek,150px);overflow:hidden;flex:0 1 auto}
    body.sheet-open .body{max-height:none;overflow:auto;flex:1 1 auto}
    #panelOpen{display:none!important}
    .hint{display:none}
  }
  .sheet-toggle .lineh{display:flex;align-items:center;gap:8px;width:100%}
  .sheet-toggle .sub2{font-size:12px;font-weight:400;color:var(--muted)}

  .fab{position:fixed;z-index:6;top:max(12px,env(safe-area-inset-top));right:16px;display:none;background:var(--glass);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:500;cursor:pointer;backdrop-filter:blur(10px)}
  body.panel-closed .fab{display:block}

  .info{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 58px);width:min(330px,calc(100vw - 32px));background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
  .info[hidden]{display:none}
  .info .ih{display:flex;align-items:flex-start;gap:8px}
  .info .ih b{flex:1;font-size:14px;font-weight:600;line-height:1.3}
  .info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:12.5px}
  .info dt{color:var(--muted)}
  .info dd{margin:0}
  .hint{position:fixed;z-index:4;left:16px;bottom:14px;font-size:11.5px;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:4px 9px;pointer-events:none}
  .toast{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13.5px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
  .toast[hidden]{display:none}
  #err{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5}
  #err[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" data-i18n-aria="canvas" aria-label="3D view of the dispenser"></canvas><div id="labels" aria-hidden="true"></div></div>

<header class="top">
  <div class="brand"><h1 id="title">Kibble Dispenser</h1><p id="subtitle"></p></div>
  <div class="mode" role="group" data-i18n-aria="viewMode" aria-label="View mode">
    <button type="button" data-mode="officina" aria-pressed="true" data-i18n="officina">Workshop</button>
    <button type="button" data-mode="bosco" aria-pressed="false" data-i18n="bosco">In the woods</button>
  </div>
  <button type="button" class="fs-btn" id="bFs" aria-pressed="false" data-i18n-title="fullscreen" title="Full screen">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path class="fs-enter" d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/><path class="fs-exit" d="M8 3v5H3M17 8h-5V3M12 17v-5h5M3 12h5v5"/></svg>
    <span class="t" id="fsLabel">Full screen</span>
  </button>
</header>

<div class="info" id="info" hidden role="status">
  <div class="ih"><b id="infoName"></b><button class="icon-btn" id="infoClose" type="button" data-i18n-aria="showAll" aria-label="Show all">×</button></div>
  <dl id="infoDl"></dl>
</div>

<aside class="panel" id="panel" data-i18n-aria="controls" aria-label="Controls">
  <div class="head">
    <button class="sheet-toggle" id="sheetToggle" type="button" aria-expanded="false">
      <span class="grip" aria-hidden="true"></span>
      <span class="lineh"><span data-i18n="controls">Controls</span><span class="sub2" id="headSub"></span><span class="chev" aria-hidden="true"></span></span>
    </button>
    <button class="icon-btn" id="panelClose" type="button" data-i18n-aria="hideControls" aria-label="Hide the controls">×</button>
  </div>
  <div class="body" id="panelBody">
    <section class="sec" id="secMain">
      <div class="fader"><label for="fExp"><span data-i18n="explode">Exploded view</span><b id="vExp">0%</b></label><input type="range" id="fExp" min="0" max="100" step="1" value="0"></div>
      <div class="fader"><label for="fDisc"><span data-i18n="disc">Disc</span><b id="vDisc">0°</b></label><input type="range" id="fDisc" min="0" max="360" step="1" value="0"></div>
    </section>

    <section class="sec" id="secForest" hidden>
      <h2 data-i18n="bosco">In the woods</h2>
      <div class="btns"><button class="btn primary" id="bNear" type="button" data-i18n="near">Move close to the dispenser</button><button class="btn" id="bWide" type="button" data-i18n="wide">Overview</button></div>
      <div class="fader"><label for="fSun"><span data-i18n="sun">Sun</span><b id="vSun">morning</b></label><input type="range" id="fSun" min="0" max="100" step="1" value="34"></div>
      <label class="switch"><input type="checkbox" id="tPipe"> <span data-i18n="pipe">DN50 pipe down to the bowl (optional)</span></label>
    </section>

    <section class="sec">
      <div class="sec-h"><h2 data-i18n="section">Section</h2><span class="grow"></span><label class="switch"><input type="checkbox" id="tSec" data-i18n-aria="section" aria-label="Section"></label></div>
      <div class="row2">
        <div class="seg" id="secAxis" role="group" data-i18n-aria="secAxis" aria-label="Section axis"><button type="button" data-a="x" aria-pressed="false">X</button><button type="button" data-a="y" aria-pressed="true">Y</button><button type="button" data-a="z" aria-pressed="false">Z</button></div>
        <label class="switch"><input type="checkbox" id="tInv"> <span data-i18n="invert">Invert</span></label>
      </div>
      <div class="fader"><label for="fSec"><span data-i18n="position">Position</span><b id="vSec">0 mm</b></label><input type="range" id="fSec" min="-100" max="100" step="0.5" value="0"></div>
    </section>

    <section class="sec">
      <h2 data-i18n="groups">Groups</h2>
      <div class="chips" id="chips"></div>
      <div class="fader"><label for="fGhost"><span data-i18n="ghost">Structure transparency</span><b id="vGhost">0%</b></label><input type="range" id="fGhost" min="0" max="100" step="1" value="0"></div>
    </section>

    <section class="sec">
      <h2 data-i18n="view">View</h2>
      <div class="btns" id="views">
        <button class="btn" type="button" data-view="iso" data-i18n="iso">Iso</button>
        <button class="btn" type="button" data-view="front" data-i18n="front">Front</button>
        <button class="btn" type="button" data-view="side" data-i18n="side">Side</button>
        <button class="btn" type="button" data-view="below" data-i18n="below">From below</button>

      [[t('iGroup'),gLabel(p.group)],[t('iMaterial'),tr(p.material)||'—'],[t('iQty'),'×'+(p.qty||1)],[t('iOrigin'),p.bought?t('originBuy'):t('originPrint')],[t('iMesh'),t('tris',p.faces,p.faces_orig)]].forEach(([k,v])=>{dl.append(el('dt',null,k),el('dd',null,v));});
    }
    onIsolate=isolate; onGroups=()=>{looksDirty=true;};
    $('bAll').addEventListener('click',()=>isolate(null));$('infoClose').addEventListener('click',()=>isolate(null));
    $('views').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='bReset'){isolate(null);home(S.mode);return;}preset(b.dataset.view);});
    $('bNear').addEventListener('click',nearView);$('bWide').addEventListener('click',()=>home('bosco'));

    /* ---------- look (opacity, ghost, caps) ---------- */
    let looksDirty=true;
    function applyLook(P){
      const vis=S.groupsOn[P.group]!==false; P.root.visible=vis;
      let op=P.base*(P.ghost?1-0.9*S.ghost:1); const lo=Math.min(op,0.07); op=lo+(op-lo)*P.fade;
      const tr=op<0.995;
      if(tr!==P.tr){P.tr=tr;P.front.transparent=tr;P.front.depthWrite=!tr;P.front.side=tr?THREE.DoubleSide:THREE.FrontSide;P.front.needsUpdate=true;P.mesh.castShadow=!tr;}
      P.front.opacity=op; P.backMesh.visible=!tr&&(!P.closed||S.secOn);
      const capOn=S.secOn&&!tr&&vis&&P.closed;
      if(P.cap){P.cap.visible=capOn;P.stB.visible=P.stF.visible=capOn;}
    }

    /* ---------- labels ---------- */
    const labs=P3.map(P=>{const e=el('div','lab'),d=el('span','dot'),tx=el('span','txt',tr(P.src.label||P.src.name));d.style.background=P.src.color;e.append(d,tx);labelsEl.append(e);return {P,e,tx,shown:false,flip:false,w:0,h:0};});
    onLang=()=>{labs.forEach(o=>{o.tx.textContent=tr(o.P.src.label||o.P.src.name);o.w=0;});fillInfo();};
    const pv=new V3(),cv=new V3();
    function drawLabels(){
      const shown=[];
      labs.forEach(o=>{let vis=S.labels&&o.P.root.visible&&o.P.fadeGoal===1&&(S.iso==null||o.P.i===S.iso);
        if(vis){pv.copy(o.P.anchor).applyMatrix4(o.P.holder.matrixWorld);cv.copy(pv).applyMatrix4(camera.matrixWorldInverse);
          if(cv.z>-camera.near)vis=false;else{pv.project(camera);if(Math.abs(pv.x)>1.1||Math.abs(pv.y)>1.1)vis=false;else{o.x=(pv.x*.5+.5)*W;o.y=(-pv.y*.5+.5)*H;shown.push(o);}}}
        if(vis!==o.shown){o.e.style.display=vis?'flex':'none';o.shown=vis;}});
      shown.forEach(o=>{const flip=o.x>W*0.55;if(flip!==o.flip){o.e.classList.toggle('flip',flip);o.flip=flip;o.w=0;}if(!o.w){o.w=o.e.offsetWidth;o.h=o.e.offsetHeight;}});
      shown.sort((a,b)=>a.y-b.y);const placed=[];
      shown.forEach(o=>{const x0=o.flip?o.x+4-o.w:o.x-4,x1=x0+o.w;let y=o.y;
        for(let it=0;it<10;it++){const hit=placed.find(r=>x0<r.x1&&x1>r.x0&&Math.abs(y-r.y)<(o.h+r.h)/2+2);if(!hit)break;y=hit.y+(o.h+hit.h)/2+2;}
        placed.push({x0,x1,y,h:o.h});o.e.style.transform='translate('+x0.toFixed(1)+'px,'+y.toFixed(1)+'px) translateY(-50%)';});
    }

    /* ---------- mode switch ---------- */
    const modeBtns=[...document.querySelectorAll('.mode button')];
    function applyMode(){
      const fm=S.mode==='bosco';
      off.visible=!fm; if(forest)forest.group.visible=fm;
      unit.position.copy(fm?U:new V3());
      scene.environment=fm?envForest:envStudio;
      scene.fog=fm&&forest?forest.fog:null;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,fm&&lowPower?1.75:2));
      renderer.toneMappingExposure=fm?1.0:1.05;
      body.classList.toggle('forest',fm);
      $('secForest').hidden=!fm;
      modeBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
      C=CAM[S.mode]; goal.t=goal.r=goal.az=goal.el=null;
      kPath=buildKibPath(fm?new V3(outlet.x,outlet.y,HEAP_TOP-U.z):outlet.clone().addScaledVector(outDir,170));
      scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.needsUpdate=true;});}});
      if(S.iso!=null)focusPart(S.iso);
      looksDirty=true; setPeek(); resize();
    }
    let forestInit=false;
    function setMode(m){
      if(m===S.mode)return; S.mode=m;
      if(m==='bosco'&&!forest){toast(t('forest'));modeBtns.forEach(b=>b.disabled=true);
        setTimeout(()=>{try{forest=buildForest();}catch(e){console.error(e);showErr(t('errForest')+e.message);}
          modeBtns.forEach(b=>b.disabled=false);toast(null);if(!forestInit){home('bosco',true);forestInit=true;}applyMode();},40);return;}
      applyMode();
    }
    modeBtns.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

    /* ---------- resize ---------- */
    function resize(){W=Math.max(1,stage.clientWidth);H=Math.max(1,stage.clientHeight);renderer.setSize(W,H,false);camera.aspect=W/H;
      const v=viewRect();camera.setViewOffset(W,H,v.dx,v.dy,W,H);camera.updateProjectionMatrix();labs.forEach(o=>{o.w=0;});}
    new ResizeObserver(resize).observe(stage); new ResizeObserver(()=>{resize();}).observe($('panel')); onLayout=resize;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    resize(); home('officina',true);
    kPath=buildKibPath(outlet.clone().addScaledVector(outDir,170));
    setClipping(); updateSection();

    // test / automation hook
    window.__viewer={S,setMode,isolate,preset,nearView,home:()=>home(S.mode),lang:()=>lang,toggleFullscreen:toggleFs,
      set:(k,v)=>{({exp:rExp,disc:rDisc,ghost:rGhost,sun:rSun,sec:rSec})[k].set(v);},
      section:(on,axis)=>{if(axis){const b=$('secAxis').querySelector('[data-a="'+axis+'"]');b&&b.click();}$('tSec').checked=on;S.secOn=on;onSection(true);},
      ready:false,frames:0,info:()=>JSON.stringify(renderer.info.render),
      snap:()=>{S.expl=S.explGoal;S.disc=S.discGoal;S.ghost=S.ghostGoal;P3.forEach(P=>{P.fade=P.fadeGoal;});looksDirty=true;if(goal.t){C.t.copy(goal.t);goal.t=null;}if(goal.r!=null){C.r=goal.r;goal.r=null;}if(goal.az!=null){C.az=goal.az;goal.az=null;}if(goal.el!=null){C.el=goal.el;goal.el=null;}}};

    /* ---------- frame loop ---------- */
    let last=performance.now(), clock=0, lastExp=-1, lastGhost=-1;
    function frame(now){
      const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
      const k=reduce?1:1-Math.pow(0.0006,dt);
      const ease=(a,b)=>Math.abs(b-a)<1e-4?b:a+(b-a)*k;
      S.expl=ease(S.expl,S.explGoal); S.disc=ease(S.disc,S.discGoal); S.ghost=ease(S.ghost,S.ghostGoal);
      // camera easing
      if(goal.t){C.t.lerp(goal.t,k);if(C.t.distanceTo(goal.t)<0.05){C.t.copy(goal.t);goal.t=null;}}
      if(goal.r!=null){C.r+=(goal.r-C.r)*k;if(Math.abs(goal.r-C.r)<0.05){C.r=goal.r;goal.r=null;}}
      if(goal.az!=null){let d=goal.az-C.az;d=Math.atan2(Math.sin(d),Math.cos(d));C.az+=d*k;if(Math.abs(d)<1e-3){C.az=goal.az;goal.az=null;}}
      if(goal.el!=null){const d=goal.el-C.el;C.el+=d*k;if(Math.abs(d)<1e-3){C.el=goal.el;goal.el=null;}}
      C.r=clamp(C.r,C.lim.rMin,C.lim.rMax);
      if(C.t.z+C.r*Math.sin(C.el)<C.lim.minZ)C.el=Math.asin(clamp((C.lim.minZ-C.t.z)/C.r,-1,1));
      const ce=Math.cos(C.el);
      camera.position.set(C.t.x+C.r*ce*Math.cos(C.az),C.t.y+C.r*ce*Math.sin(C.az),C.t.z+C.r*Math.sin(C.el));
      camera.lookAt(C.t);
      const fm=S.mode==='bosco', nearP=fm?clamp(C.r/45,4,60):clamp(C.r/60,0.5,40), farP=fm?200000:Math.max(4000,C.r*20);
      if(Math.abs(camera.near-nearP)>nearP*0.2||camera.far!==farP){camera.near=nearP;camera.far=farP;camera.updateProjectionMatrix();}
      // parts
      P3.forEach(P=>{P.root.position.copy(P.exp).multiplyScalar(S.expl);if(P.pivot)P.pivot.rotation.z=S.disc*DEG;
        if(P.fade!==P.fadeGoal){P.fade=Math.abs(P.fadeGoal-P.fade)<0.01?P.fadeGoal:P.fade+(P.fadeGoal-P.fade)*k;looksDirty=true;}});
      if(S.ghost!==lastGhost){lastGhost=S.ghost;looksDirty=true;}
      if(looksDirty){P3.forEach(applyLook);looksDirty=false;}
      if(S.secOn)updateSection();
      // workshop floor follows the lowest exploded part
      if(!fm){let mz=Infinity;P3.forEach(P=>{if(P.root.visible)mz=Math.min(mz,P.box.min.z+P.exp.z*S.expl);});if(!isFinite(mz))mz=restBox.min.z;
        grid.position.set(restC.x,restC.y,mz-1);catcher.position.set(restC.x,restC.y,mz-0.6);}
      else if(forest){forest.sky.position.copy(camera.position);forest.fill.position.copy(camera.position);forest.fill.target.position.copy(C.t);}
      // kibble
      const kOn=S.kibble&&S.expl<0.01&&S.iso==null&&kPath; if(kOn){if(!reduce)clock+=dt;placeKibble(clock);}else kib.visible=false;
      renderer.render(scene,camera);
      drawLabels();
      window.__viewer.frames++; if(window.__viewer.frames>2)window.__viewer.ready=true;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
